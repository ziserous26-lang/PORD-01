<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PORD-01 | Sports Teams</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1822;color:#f4f8ff;font:18px Arial,sans-serif}main{max-width:980px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}a{color:#cfe2ff;text-decoration:none}h1{font-size:34px}p{color:#bfcddd}.panel{background:#162837;border:1px solid #4b6376;border-radius:16px;padding:22px;margin:20px 0}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:flex;flex-direction:column;gap:7px;font-size:16px}input{font:inherit;padding:13px;border-radius:9px;background:#091622;border:1px solid #62778b;color:white;min-width:0}input[type=color]{height:52px;padding:4px}.wide{grid-column:1/-1}button{font:inherit;padding:13px 22px;border-radius:11px;background:#1764ff;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.team{border:1px solid #506579;border-radius:13px;padding:15px;display:flex;align-items:center;gap:13px;background:#132433;cursor:pointer}.team img{width:72px;height:72px;object-fit:contain}.team span{font-size:15px;color:#c6d7e8}#status{min-height:22px;color:#fbd9a2}@media(max-width:600px){.form{grid-template-columns:1fr}.wide{grid-column:auto}header{flex-wrap:wrap}}</style></head><body><main><header><div><b>PORD-01</b><h1>Sports team logos</h1></div><a href="calendar.html">← Calendar</a></header><p>Add each team once. Use the exact team name you enter when creating a sports event in the calendar. PNG with a transparent background works best.</p><section class="panel"><form id="form" class="form"><label>Team name<input id="name" placeholder="Columbus Blue Jackets" required maxlength="120"></label><label>Abbreviation<input id="abbr" placeholder="CBJ" maxlength="10"></label><label>Team background color<input id="color" type="color" value="#003876"></label><label>Team logo (PNG, JPG, WebP or SVG; max 5 MB)<input id="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><label class="wide">Or existing public logo URL (optional)<input id="url" type="url" placeholder="https://..."></label><div class="wide"><button type="submit" id="save">Save team</button></div></form><p id="status"></p></section><h2>Saved teams</h2><div id="teams" class="teams"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const db=window.supabase?window.supabase.createClient('https://xxsxhxuaxhvfhpgodhnk.supabase.co','sb_publishable_zdPwmxzkFiMTyGqaW0w15Q_iT4RAILn'):null;let user=null,records=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){if(!db)throw Error('Supabase library unavailable');const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.href='index.html';return}user=session.user;await refresh()}
async function refresh(){const {data,error}=await db.from('sports_teams').select('*').eq('user_id',user.id).order('name');if(error)throw error;records=data||[];$('teams').innerHTML=records.length?records.map((t,i)=>`<div class="team" data-i="${i}"><img src="${esc(t.logo_url||'')}" alt="" onerror="this.style.display='none'"><div><b>${esc(t.name)}</b><br><span>${esc(t.abbreviation||'')} · ${esc(t.primary_color||'')}</span></div></div>`).join(''):'<p>No teams saved yet.</p>';document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{const t=records[Number(el.dataset.i)];$('name').value=t.name;$('abbr').value=t.abbreviation||'';$('color').value=/^#[0-9a-f]{6}$/i.test(t.primary_color||'')?t.primary_color:'#224e69';$('url').value=t.logo_url||'';$('logo').value='';window.scrollTo(0,0)})}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('status').textContent='Saving team…';try{if(!user)throw Error('Sign in first');const name=$('name').value.trim(),abbr=$('abbr').value.trim(),color=$('color').value;let logoUrl=$('url').value.trim();const file=$('logo').files[0];if(file){if(file.size>5242880)throw Error('Logo must be smaller than 5 MB');const types=['image/png','image/jpeg','image/webp','image/svg+xml'];if(!types.includes(file.type))throw Error('Use PNG, JPG, WebP, or SVG');const ext=({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/svg+xml':'svg'})[file.type];const path=user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const {error}=await db.storage.from('sports-logos').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;logoUrl=db.storage.from('sports-logos').getPublicUrl(path).data.publicUrl;}const prior=records.find(t=>t.name.toLowerCase()===name.toLowerCase());const data={name,abbreviation:abbr,primary_color:color,logo_url:logoUrl||null,user_id:user.id};const res=prior?await db.from('sports_teams').update(data).eq('id',prior.id).eq('user_id',user.id):await db.from('sports_teams').insert(data);if(res.error)throw res.error;$('status').textContent='Saved! The logo will appear on the next slideshow refresh.';$('logo').value='';await refresh()}catch(err){$('status').textContent='Error: '+err.message}finally{$('save').disabled=false}};
init().catch(e=>$('status').textContent='Error: '+e.message);
</script></body></html>
