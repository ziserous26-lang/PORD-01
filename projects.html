<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PORD-01 | Projects</title><style>
:root{color-scheme:dark;--bg:#09141e;--panel:#101e2a;--border:#536370;--muted:#c2ceda;--green:#9bf5ce;--yellow:#ffe276;--red:#ff858b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at 55% 45%,#162632,#09141e 80%);color:#f7f9fc;font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:14px 28px 19px;gap:14px}.top{height:113px;flex:none;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:35px;font-weight:800}.nav{display:flex;align-items:center;justify-content:center;gap:12px;border:2px solid #f1f5fa;border-radius:16px;min-height:55px;min-width:195px;padding:8px 18px;background:transparent;color:#fff;font-size:21px;font-weight:700}.nav svg{width:25px;height:25px}.top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:9px}.new-project{background:#1764ff;border:0;color:white;border-radius:12px;padding:11px 23px;font-size:18px;font-weight:700;min-width:195px;min-height:45px}.muted{color:var(--muted)}.intro{flex:none}.intro h1{font-size:39px;margin:0 0 5px}.intro p{font-size:19px;margin:0}.panel{background:rgba(16,29,40,.65);border:1.5px solid var(--border);border-radius:19px}.status{font-size:12px;min-height:15px;color:#b9c8d4}.scroll{overflow-y:auto;min-height:0;scrollbar-color:#536574 transparent}.green{--accent:var(--green);--accent-bg:rgba(31,126,85,.2);--edge:#62b990}.yellow{--accent:var(--yellow);--accent-bg:rgba(133,112,38,.22);--edge:#e4c651}.red{--accent:var(--red);--accent-bg:rgba(148,50,55,.2);--edge:#e56c70}.progress{height:14px;border-radius:15px;background:color-mix(in srgb,var(--accent) 28%,#1c2d36);overflow:hidden}.fill{height:100%;border-radius:15px;background:var(--accent);width:0}.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal-back.open{display:flex}.modal{width:min(520px,96vw);max-height:94vh;overflow:auto;background:#142432;border:1.5px solid #657785;border-radius:18px;padding:23px}.modal h2{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:#d7e2eb;font-size:14px}.wide{grid-column:1/-1}.field input,.field textarea{width:100%;background:#091722;border:1px solid #526675;border-radius:9px;color:#fff;padding:11px}.field textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}.btn{background:#263846;color:white;border:1px solid #697986;border-radius:11px;padding:11px 20px}.btn.primary{background:#1267f7;border-color:#1267f7;font-weight:700}.btn.danger{margin-right:auto;color:#ffb4b4}.empty{color:#bfcbd7;padding:25px;text-align:center}.hidden{display:none!important}@media(max-width:760px){.app{height:auto;min-height:100dvh;overflow:visible;padding:14px}.brand{font-size:26px}.nav{min-width:0;font-size:15px;min-height:42px}.intro h1{font-size:31px}}
</style><style>.overview{flex:1;min-height:0;display:grid;grid-template-columns:38% minmax(0,1fr);gap:22px}.project-list{display:flex;flex-direction:column;gap:15px;padding:2px 2px 5px}.project-card{flex:0 0 155px;min-height:155px;max-height:155px;display:flex;flex-direction:column;justify-content:center;padding:19px 24px;border:1.5px solid var(--edge);border-radius:19px;background:var(--accent-bg);text-align:left;color:white;cursor:pointer}.project-card:hover{filter:brightness(1.13)}.project-card.selected{outline:3px solid #8ab6ff;outline-offset:-3px}.project-list{overflow-y:auto;min-height:0;align-content:start}.timeline-top h2{min-width:0}.back-all{border:1px solid #647b8d;background:#25394a;color:white;border-radius:9px;padding:8px 12px;font-weight:700}.gantt-project{font-weight:800;color:#c5d8e9;padding:13px 0 6px;font-size:15px}.gantt-task{min-height:59px}.gantt-task .row-name{font-size:14px;padding-left:8px}.gantt-task .bar{height:23px}.gantt-task .bar-label{font-size:12px;top:3px}.gantt-axis{display:grid;grid-template-columns:160px 1fr}.gantt-month{border-left:1px solid #506778;text-align:center;padding:6px 0;font-weight:800}.gantt-weeks{display:grid;grid-template-columns:repeat(4,1fr)}.gantt-weeks span{text-align:center;border-left:1px solid #506778;font-size:12px;padding:5px 0;color:#cbd8e4}.project-card .eyebrow{font-size:17px;font-weight:800;color:var(--accent);margin-bottom:7px}.card-title{font-size:27px;font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card-percent{font-size:37px;font-weight:800;color:var(--accent)}.card-bottom{font-size:17px;color:#e0e8ef;margin-top:12px}.timeline{min-width:0;min-height:0;padding:22px 19px 17px;display:flex;flex-direction:column}.timeline-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.timeline h2{font-size:28px;margin:0}.modes{display:flex;border:1px solid #657482;border-radius:12px;overflow:hidden}.modes button{background:#1d2b39;color:white;border:0;padding:10px 15px;font-size:15px}.modes button.selected{background:#305aa9;outline:1px solid #4e86fc;border-radius:10px}.chart-scroll{flex:1;margin-top:25px;overflow:auto}.chart{min-width:560px;position:relative}.chart-head{display:grid;grid-template-columns:160px 1fr;min-height:40px}.axis{display:grid;border-bottom:1px solid #657482}.axis span{border-left:1px solid #485b69;text-align:center;padding:7px 0;font-weight:700;font-size:15px}.chart-row{display:grid;grid-template-columns:160px 1fr;min-height:88px;border-bottom:1px solid #384a58;align-items:center}.row-name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}.track{height:100%;position:relative;background:repeating-linear-gradient(to right,transparent 0,transparent calc(16.666% - 1px),#344654 calc(16.666% - 1px),#344654 16.666%)}.bar{position:absolute;top:50%;transform:translateY(-50%);height:31px;border:1.5px solid var(--edge);border-radius:10px;background:var(--accent-bg);overflow:hidden;min-width:12px;cursor:pointer}.bar .fill{border-radius:7px;height:100%;opacity:.9}.bar-label{position:absolute;right:7px;top:5px;font-weight:700;font-size:15px;text-shadow:0 1px 3px #000}.chart-note{font-size:12px;color:#b7c6d4;margin-top:10px}@media(max-width:760px){.overview{display:block}.project-list{overflow-y:auto;max-height:520px}.project-card{margin-bottom:12px}.timeline{height:450px}.chart{min-width:500px}}</style></head><body><div class="app"><header class="top"><div class="brand">PORD-01</div><div class="top-actions"><a class="nav" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4"/></svg>Dashboard</a><button class="new-project" id="newProject">＋ New project</button></div></header><section class="intro"><h1>Projects</h1><p class="muted">All projects, timeline, and progress at a glance.</p></section><main class="overview"><section class="project-list scroll" id="cards"><div class="empty">Loading projects…</div></section><section class="panel timeline"><div class="timeline-top"><h2 id="timelineHeading">Project timeline</h2><button id="backAll" class="back-all hidden" type="button">All projects</button><div class="modes"><button data-mode="week">Week</button><button data-mode="month" class="selected">Month</button><button data-mode="quarter">Quarter</button></div></div><div class="chart-scroll scroll"><div id="chart"></div></div></section></main><div class="status" id="status"></div></div><div class="modal-back" id="projectModal"><div class="modal"><h2>New project</h2><form id="projectForm"><div class="fields"><label class="field wide">Project name<input id="projectName" required maxlength="180"></label><label class="field wide">Description<textarea id="projectDescription"></textarea></label></div><div class="actions"><button class="btn" type="button" id="projectCancel">Cancel</button><button class="btn primary" type="submit" id="projectSave">Create project</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const db=window.supabase?window.supabase.createClient('https://xxsxhxuaxhvfhpgodhnk.supabase.co','sb_publishable_zdPwmxzkFiMTyGqaW0w15Q_iT4RAILn'):null;
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,projects=[],tasks=[];
const prop=(o,keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null};
const projTitle=p=>prop(p,['name','title','project_name'])||'Untitled project';
const taskTitle=t=>prop(t,['title','name','task_name'])||'Untitled task';
const projectStart=p=>{const dates=projectTasks(p).map(t=>asDate(prop(t,['start_date','start_at']))).filter(Boolean);return dates.length?new Date(Math.min(...dates.map(d=>d.getTime()))):null};
const projectDue=p=>{const ends=projectTasks(p).map(t=>asDate(prop(t,['end_date','due_date','due_at']))).filter(Boolean);return ends.length?new Date(Math.max(...ends.map(d=>d.getTime()))):null};
const taskDone=t=>t.completed===true||t.is_complete===true||t.is_completed===true||t.done===true||t.status==='completed'||t.status==='done';
const projectTasks=p=>tasks.filter(t=>String(prop(t,['project_id','project_uuid']))===String(p.id));
const asDate=x=>{if(!x)return null;const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(x))?String(x)+'T12:00:00':x);return isNaN(d)?null:d};
const fmtDate=x=>{const d=asDate(x);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'No due date'};
function metrics(p){const list=projectTasks(p),done=list.filter(taskDone).length,total=list.length,actual=total?done/total:0,start=asDate(projectStart(p)),end=asDate(projectDue(p));let expected=0;if(start&&end&&end>start){expected=Math.max(0,Math.min(1,(Date.now()-start.getTime())/(end-start)));}else if(end&&Date.now()>end.getTime())expected=1;const gap=expected-actual;const color=gap>.35?'red':gap>.12?'yellow':'green';return {done,total,actual,expected,color,pct:Math.round(actual*100),label:color==='red'?'WAY BEHIND':color==='yellow'?'BEHIND SCHEDULE':'IN PROGRESS'};}
async function initData(){if(!db)throw Error('Supabase library did not load. Check your internet connection.');const {data:{session},error:se}=await db.auth.getSession();if(se)throw se;if(!session){location.href='index.html';return false;}user=session.user;const [pr,tr]=await Promise.all([db.from('projects').select('*').eq('user_id',user.id),db.from('tasks').select('*').eq('user_id',user.id)]);if(pr.error)throw pr.error;if(tr.error)throw tr.error;projects=pr.data||[];tasks=tr.data||[];return true;}
function showError(e){$('status').textContent='Error: '+(e.message||String(e));}
</script><script>
let mode='month',selectedProjectId=null;
function selectProject(id){
 if(selectedProjectId===id){location.href='project-details.html?id='+encodeURIComponent(id);return;}
 selectedProjectId=id;mode='week';syncModeButtons();renderCards();renderChart();
}
function renderCards(){
 const box=$('cards');
 if(!projects.length){box.innerHTML='<div class="empty">No projects yet. Select New project to get started.</div>';return;}
 box.innerHTML=projects.map(p=>{const m=metrics(p);return `<button class="project-card ${m.color} ${selectedProjectId===String(p.id)?'selected':''}" data-id="${safe(p.id)}" title="${selectedProjectId===String(p.id)?'Click again to open details':'Click to view task timeline'}"><div class="eyebrow">${m.label}</div><div class="card-top"><div class="card-title">${safe(projTitle(p))}</div><div class="card-percent">${m.pct}%</div></div><div class="progress"><div class="fill" style="width:${m.pct}%"></div></div><div class="card-bottom">${projectDue(p)?'Due '+safe(fmtDate(projectDue(p))):'No task end date'} &nbsp; · &nbsp; ${m.done} of ${m.total} tasks</div></button>`}).join('');
 box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>selectProject(b.dataset.id));
}
function startOf(d,unit){let x=new Date(d);x.setHours(0,0,0,0);if(unit==='week')x.setDate(x.getDate()-x.getDay());else if(unit==='month')x.setDate(1);else {x.setMonth(Math.floor(x.getMonth()/3)*3,1)}return x}
function advance(d,unit,n=1){let x=new Date(d);if(unit==='week')x.setDate(x.getDate()+7*n);else if(unit==='month')x.setMonth(x.getMonth()+n);else x.setMonth(x.getMonth()+3*n);return x}
function renderChart(){
 const selected=projects.find(p=>String(p.id)===selectedProjectId);
 $('timelineHeading').textContent=selected?projTitle(selected)+' · Task timeline':'Project timeline';
 $('backAll').classList.toggle('hidden',!selected);
 const rows=selected?[...projectTasks(selected)].sort((a,b)=>(asDate(prop(a,['start_date','start_at']))?.getTime()??Infinity)-(asDate(prop(b,['start_date','start_at']))?.getTime()??Infinity)):projects;
 const now=new Date();
 const getStart=r=>selected?asDate(prop(r,['start_date','start_at'])):asDate(projectStart(r));
 const getEnd=r=>selected?asDate(prop(r,['end_date','due_date','due_at'])):asDate(projectDue(r));
 const starts=rows.map(getStart).filter(Boolean),ends=rows.map(getEnd).filter(Boolean);
 let anchor=mode==='week'&&selected?(starts.length?new Date(Math.min(...starts.map(d=>d.getTime()))):now):mode==='week'?now:(starts.length?new Date(Math.min(...starts.map(d=>d.getTime()))):now);
 if(!selected&&anchor>now)anchor=now;
 let first=startOf(anchor,mode);
 let latest=ends.length?new Date(Math.max(...ends.map(d=>d.getTime()))):advance(first,mode,2);
 if(latest<first)latest=advance(first,mode,2);
 let count=mode==='week'?5:3;
 if(mode!=='week')while(count<12&&advance(first,mode,count)<=latest)count++;
 const boundaries=Array.from({length:count+1},(_,i)=>advance(first,mode,i));
 const min=boundaries[0].getTime(),max=boundaries[count].getTime(),span=Math.max(1,max-min);
 const axis=boundaries.slice(0,-1).map(d=>`<span>${mode==='week'?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):mode==='month'?d.toLocaleDateString('en-US',{month:'short',year:'numeric'}):'Q'+(Math.floor(d.getMonth()/3)+1)+' '+d.getFullYear()}</span>`).join('');
 const lines=rows.map(r=>{
  const m=selected?null:metrics(r),a=getStart(r),b=getEnd(r),name=selected?taskTitle(r):projTitle(r);
  const begin=a||b||asDate(r.created_at)||now;
  // Gantt dates are inclusive: a one-day task must occupy one full day.
  // The exclusive end boundary also gives every dated task a visible bar.
  const endDate=b||a;
  const finish=endDate?new Date(endDate.getFullYear(),endDate.getMonth(),endDate.getDate()+1):advance(begin,'week',1);
  const left=Math.max(0,Math.min(100,100*(begin-min)/span));
  const right=Math.max(0,Math.min(100,100*(finish-min)/span));
  const visible=finish>new Date(min)&&begin<new Date(max)&&right>left;
  const color=selected?(taskDone(r)?'green':'yellow'):m.color;
  const percentage=selected?(taskDone(r)?100:0):m.pct;
  const note=selected?(a||b?`${a?fmtDate(a):'Unscheduled'} – ${b?fmtDate(b):'No end'}`:'Dates not set'):'Open project';
  return `<div class="chart-row ${selected?'gantt-task':''}"><div class="row-name" title="${safe(name)}">${safe(name)}</div><div class="track" style="background-size:${100/count}% 100%"><div class="bar ${color}" title="${safe(note)}" style="${visible?`left:${left}%;width:${right-left}%`:'display:none'}"><div class="fill" style="width:${percentage}%"></div>${!selected?`<span class="bar-label">${percentage}%</span>`:''}</div></div></div>`;
 }).join('');
 $('chart').innerHTML=`<div class="chart"><div class="chart-head"><div></div><div class="axis" style="grid-template-columns:repeat(${count},1fr)">${axis}</div></div>${selected?`<div class="gantt-project">${safe(projTitle(selected))} · ${rows.length} tasks</div>`:''}${lines||'<div class="empty">'+(selected?'No tasks yet. Open project details to add tasks.':'Projects will appear here when added.')+'</div>'}</div><div class="chart-note">${selected?'Task bars run from each task’s start date to its end date. Click the selected project card again to open its details.':'Select a project card to see its task-level Gantt chart. Click the same card again for details.'}</div>`;
}
$('backAll').onclick=()=>{selectedProjectId=null;renderCards();renderChart()};
const projectModal=$('projectModal');
$('newProject').onclick=()=>{
 $('projectName').value='';$('projectDescription').value='';

 projectModal.classList.add('open');
};
$('projectCancel').onclick=()=>projectModal.classList.remove('open');
projectModal.onclick=e=>{if(e.target===projectModal)projectModal.classList.remove('open')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')projectModal.classList.remove('open')});
$('projectForm').onsubmit=async e=>{
 e.preventDefault();
 if(!user){$('status').textContent='Please sign in first.';return;}
 const name=$('projectName').value.trim(),description=$('projectDescription').value.trim();
 if(!name){$('status').textContent='Enter a project name.';return;}
 const save=$('projectSave');save.disabled=true;
 try{
  const sample=projects[0]||{};
  const nameField=['name','title','project_name'].find(k=>Object.prototype.hasOwnProperty.call(sample,k))||'name';
  const descField=['description','notes'].find(k=>Object.prototype.hasOwnProperty.call(sample,k))||'description';
  const variants=[
   {[nameField]:name,[descField]:description,start_date:null,due_date:null,status:'active'},
   {[nameField]:name,[descField]:description,start_date:null,due_date:null},
   {[nameField]:name,start_date:null,due_date:null,status:'active'},
   {[nameField]:name,start_date:null,due_date:null}
  ];
  let result;
  for(const v of variants){
   result=await db.from('projects').insert({...v,user_id:user.id}).select().single();
   if(!result.error)break;
   if(!/column|schema cache|not-null|null value/i.test(result.error.message))break;
  }
  if(result.error)throw result.error;
  projects.push(result.data);projectModal.classList.remove('open');
  $('status').textContent='Project created.';renderCards();renderChart();
 }catch(err){showError(err)}finally{save.disabled=false}
};
function syncModeButtons(){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x.dataset.mode===mode));}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;syncModeButtons();renderChart();});
(async()=>{try{if(await initData()){renderCards();renderChart();}}catch(e){showError(e);$('cards').innerHTML='<div class="empty">Unable to load projects. Check the message below.</div>'}})();
</script></body></html>
