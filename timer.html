<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PORD-01 | Focus Timer</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:#f8faff;background:radial-gradient(ellipse at center,#1b2935,#0b151e 86%)}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:18px 38px 30px;gap:26px;overflow:hidden}.header{height:66px;flex:none;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:35px;font-weight:800;letter-spacing:-1px}.nav{display:flex;align-items:center;justify-content:center;gap:12px;min-width:215px;min-height:59px;border:2px solid #f4f6f9;border-radius:16px;font-size:21px;font-weight:700}.nav svg{width:26px;height:26px}.panel{flex:1;min-height:0;border:1.5px solid #556573;border-radius:23px;background:#ffffff03;display:flex;align-items:center;justify-content:center;padding:24px}.center{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:21px}.eyebrow{color:#c6d1dc;font-weight:800;font-size:25px;letter-spacing:.4px}.clock{font-size:clamp(110px,16vw,195px);line-height:1;font-weight:750;letter-spacing:-6px;font-variant-numeric:tabular-nums;white-space:nowrap}.sub{font-size:25px;color:#c9d4de}.presets{display:flex;justify-content:center;gap:22px;margin-top:12px}.preset{border:1.5px solid #506272;border-radius:15px;min-width:148px;min-height:62px;background:#283643;color:#f4f7fa;font-size:24px;font-weight:750}.preset.active{background:#414f78;color:#c5d2ff;border-color:#6785f3}.actions{display:flex;justify-content:center;gap:24px;margin-top:12px}.primary,.reset{border-radius:14px;min-height:68px;font-size:25px;font-weight:800}.primary{background:#2365fa;color:white;border:0;min-width:320px}.reset{background:transparent;color:#dce5ed;border:1.5px solid #71818f;min-width:154px}.primary:disabled{opacity:.6}.status{height:16px;color:#bbcad6;font-size:13px}.finished .clock{color:#9bf5ce}@media(max-height:690px){.app{gap:12px;padding-bottom:16px}.header{height:55px}.brand{font-size:29px}.nav{min-height:48px;font-size:18px}.center{gap:12px}.eyebrow{font-size:20px}.clock{font-size:clamp(85px,15vw,160px)}.sub{font-size:20px}.preset{min-height:49px}.primary,.reset{min-height:55px}}@media(max-width:700px){.app{padding:12px;gap:10px}.brand{font-size:24px}.nav{min-width:130px;min-height:43px;font-size:15px}.center{gap:14px}.eyebrow{font-size:19px}.clock{font-size:clamp(70px,17vw,130px);letter-spacing:-3px}.sub{font-size:17px}.presets{gap:8px}.preset{min-width:82px;min-height:48px;font-size:17px}.actions{gap:10px}.primary{min-width:170px}.reset{min-width:85px}.primary,.reset{font-size:17px;min-height:53px}}
</style></head><body><div class="app"><header class="header"><div class="brand">PORD-01</div><a class="nav" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4"/></svg>Dashboard</a></header><main class="panel"><div class="center" id="center"><div class="eyebrow">FOCUS TIMER</div><div class="clock" id="clock" role="timer" aria-live="off">25:00</div><div class="sub" id="subtitle">Choose a duration. Make room for one thing.</div><div class="presets"><button class="preset" data-minutes="5">5 min</button><button class="preset" data-minutes="15">15 min</button><button class="preset active" data-minutes="25">25 min</button></div><div class="actions"><button class="primary" id="start">Start timer</button><button class="reset" id="reset">Reset</button></div><div class="status" id="status"></div></div></main></div><script>
'use strict';const $=id=>document.getElementById(id);let selected=25,remaining=25*60,running=false,endAt=0,interval=null,completed=false;const storageKey='pord01-focus-timer';function persist(){try{localStorage.setItem(storageKey,JSON.stringify({selected,remaining,running,endAt,completed}))}catch(e){}}function show(){const m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('start').textContent=running?'Pause timer':remaining<selected*60&&remaining>0?'Resume timer':'Start timer';$('subtitle').textContent=completed?'Focus session complete!':running?'Stay focused. One thing at a time.':'Choose a duration. Make room for one thing.';$('center').classList.toggle('finished',completed);document.querySelectorAll('[data-minutes]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.minutes)===selected);b.setAttribute('aria-pressed',Number(b.dataset.minutes)===selected?'true':'false')});document.title=$('clock').textContent+' | PORD-01 Focus Timer'}function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=740;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.52);setTimeout(()=>ctx.close(),700)}catch(e){}}function tick(){if(!running)return;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(remaining===0){running=false;completed=true;clearInterval(interval);interval=null;beep();$('status').textContent='Time is up!';}show();persist()}function startInterval(){clearInterval(interval);interval=setInterval(tick,250)}function startPause(){if(completed){remaining=selected*60;completed=false}if(running){tick();running=false;clearInterval(interval);interval=null;$('status').textContent='Timer paused.'}else{if(remaining<=0)remaining=selected*60;running=true;endAt=Date.now()+remaining*1000;startInterval();$('status').textContent=''}persist();show()}function reset(){running=false;completed=false;clearInterval(interval);interval=null;remaining=selected*60;$('status').textContent='';persist();show()}document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.minutes);reset()});$('start').onclick=startPause;$('reset').onclick=reset;try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&[5,15,25].includes(saved.selected)){selected=saved.selected;remaining=Math.max(0,Math.min(selected*60,Number(saved.remaining)||0));completed=!!saved.completed;running=!!saved.running;endAt=Number(saved.endAt)||0;if(running){startInterval();tick()}}}catch(e){}show();document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('pagehide',persist);
</script></body></html>
