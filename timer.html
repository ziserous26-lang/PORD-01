<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PORD-01 | Focus Timer</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:#f8faff;background:radial-gradient(ellipse at center,#1b2935,#0b151e 86%)}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:18px 38px 30px;gap:26px;overflow:hidden}.header{height:66px;flex:none;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:35px;font-weight:800;letter-spacing:-1px}.nav{display:flex;align-items:center;justify-content:center;gap:12px;min-width:215px;min-height:59px;border:2px solid #f4f6f9;border-radius:16px;font-size:21px;font-weight:700}.nav svg{width:26px;height:26px}.panel{flex:1;min-height:0;border:1.5px solid #556573;border-radius:23px;background:#ffffff03;display:flex;align-items:center;justify-content:center;padding:24px}.center{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:21px}.eyebrow{color:#c6d1dc;font-weight:800;font-size:25px;letter-spacing:.4px}.clock{font-size:clamp(110px,16vw,195px);line-height:1;font-weight:750;letter-spacing:-6px;font-variant-numeric:tabular-nums;white-space:nowrap}.sub{font-size:25px;color:#c9d4de}.presets{display:flex;justify-content:center;gap:22px;margin-top:12px}.preset{border:1.5px solid #506272;border-radius:15px;min-width:148px;min-height:62px;background:#283643;color:#f4f7fa;font-size:24px;font-weight:750}.preset.custom{min-width:165px;background:#193f6b;border-color:#638bba}.preset.active{background:#414f78;color:#c5d2ff;border-color:#6785f3}.actions{display:flex;justify-content:center;gap:24px;margin-top:12px}.primary,.reset{border-radius:14px;min-height:68px;font-size:25px;font-weight:800}.primary{background:#2365fa;color:white;border:0;min-width:320px}.reset{background:transparent;color:#dce5ed;border:1.5px solid #71818f;min-width:154px}.primary:disabled{opacity:.6}.status{height:16px;color:#bbcad6;font-size:13px}.clock{font-size:clamp(84px,13vw,170px)}.finished .clock{color:#9bf5ce}@media(max-height:690px){.app{gap:12px;padding-bottom:16px}.header{height:55px}.brand{font-size:29px}.nav{min-height:48px;font-size:18px}.center{gap:12px}.eyebrow{font-size:20px}.clock{font-size:clamp(85px,15vw,160px)}.sub{font-size:20px}.preset{min-height:49px}.primary,.reset{min-height:55px}}@media(max-width:700px){.app{padding:12px;gap:10px}.brand{font-size:24px}.nav{min-width:130px;min-height:43px;font-size:15px}.center{gap:14px}.eyebrow{font-size:19px}.clock{font-size:clamp(70px,17vw,130px);letter-spacing:-3px}.sub{font-size:17px}.presets{gap:8px}.preset{min-width:82px;min-height:48px;font-size:17px}.actions{gap:10px}.primary{min-width:170px}.reset{min-width:85px}.primary,.reset{font-size:17px;min-height:53px}}

/* Touch-friendly duration picker */
.wheel-backdrop{position:fixed;inset:0;background:#000c;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}.wheel-backdrop.open{display:flex}
.wheel-dialog{width:min(670px,96vw);max-height:95vh;overflow:auto;border:1.5px solid #657b90;border-radius:22px;background:#142432;padding:20px 26px;box-shadow:0 16px 70px #0009}
.wheel-dialog h2{text-align:center;font-size:29px;margin:0 0 7px}.wheel-help{text-align:center;color:#c5d2de;font-size:16px;margin:0 0 13px}
.wheel-group{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.wheel-col{min-width:0;text-align:center}.wheel-label{font-size:18px;font-weight:800;margin-bottom:9px;color:#cbd8e8}
.wheel{height:222px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;border:1px solid #52697e;border-radius:14px;background:linear-gradient(#0d1b28,#1d3448 50%,#0d1b28);touch-action:pan-y;position:relative}.wheel::-webkit-scrollbar{display:none}.wheel-item{height:74px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;font-size:31px;font-weight:800;color:#e7eff8;user-select:none}.wheel-item.current{color:#fff}.wheel-col{position:relative}.wheel-col:after{content:'';position:absolute;left:3px;right:3px;top:calc(50% + 7px);height:74px;transform:translateY(-50%);border-top:2px solid #5b9cff;border-bottom:2px solid #5b9cff;border-radius:8px;pointer-events:none}
.wheel-actions{display:flex;justify-content:center;gap:18px;margin-top:18px}.wheel-actions button{min-height:54px;min-width:135px;border-radius:12px;border:1px solid #637b90;background:#263a4b;color:white;font-size:19px;font-weight:800}.wheel-actions .wheel-confirm{background:#2365fa;border-color:#2365fa}
@media(max-height:650px){.wheel{height:162px}.wheel-item{height:54px}.wheel-col:after{height:54px}.wheel-dialog{padding:12px 22px}.wheel-dialog h2{font-size:24px}}
@media(max-width:700px){.wheel-group{gap:6px}.wheel-item{font-size:24px}.wheel-dialog{padding:13px}.wheel-actions button{min-width:105px}}

/* Full-screen timer completion alarm */
.timeup-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;text-align:center;color:#fff;background:#830009;cursor:pointer;touch-action:manipulation;animation:timeup-pulse 1.15s ease-in-out infinite}
.timeup-overlay.visible{display:flex}
.timeup-title{font-size:clamp(75px,13vw,190px);font-weight:900;line-height:1.05;letter-spacing:-.05em;text-shadow:0 5px 30px #36000088}
.timeup-caption{font-size:clamp(20px,3vw,38px);font-weight:700}
@keyframes timeup-pulse{0%,100%{background:#650008}50%{background:#ff2029}}
@media(prefers-reduced-motion:reduce){.timeup-overlay{animation-duration:2.5s}}
</style></head><body><div class="app"><header class="header"><div class="brand">PORD-01</div><a class="nav" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4"/></svg>Dashboard</a></header><main class="panel"><div class="center" id="center"><div class="eyebrow">FOCUS TIMER</div><div class="clock" id="clock" role="timer" aria-live="off">25:00</div><div class="sub" id="subtitle">Choose a duration. Make room for one thing.</div><div class="presets"><button class="preset" data-minutes="5">5 min</button><button class="preset" data-minutes="15">15 min</button><button class="preset active" data-minutes="25">25 min</button><button class="preset custom" id="custom">Custom</button></div><div class="actions"><button class="primary" id="start">Start timer</button><button class="reset" id="reset">Reset</button></div><div class="status" id="status"></div></div></main></div>
<div class="timeup-overlay" id="timeupOverlay" role="alertdialog" aria-modal="true" aria-label="Timer finished" tabindex="0"><div class="timeup-title">Time’s Up!</div><div class="timeup-caption">Tap anywhere to dismiss</div></div><div class="wheel-backdrop" id="wheelModal" role="dialog" aria-modal="true" aria-labelledby="wheelTitle"><div class="wheel-dialog"><h2 id="wheelTitle">Set custom timer</h2><p class="wheel-help">Swipe up or down to select a duration</p><div class="wheel-group"><div class="wheel-col"><div class="wheel-label">Hours</div><div class="wheel" id="wheelHours"></div></div><div class="wheel-col"><div class="wheel-label">Minutes</div><div class="wheel" id="wheelMinutes"></div></div><div class="wheel-col"><div class="wheel-label">Seconds</div><div class="wheel" id="wheelSeconds"></div></div></div><div class="wheel-actions"><button type="button" id="wheelCancel">Cancel</button><button type="button" class="wheel-confirm" id="wheelSet">Set timer</button></div></div></div><script>

'use strict';
const $=id=>document.getElementById(id);
let selected=25*60,remaining=selected,running=false,endAt=0,interval=null,completed=false;
const storageKey='pord01-focus-timer';
let audioContext=null,alarmLoop=null,alarmActive=false;
function unlockAudio(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  if(!audioContext)audioContext=new C();
  if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
 }catch(e){}
}
function alarmChime(){
 if(!alarmActive||!audioContext)return;
 try{
  const t=audioContext.currentTime;
  [0,.18,.40].forEach((offset,i)=>{
   const osc=audioContext.createOscillator(),gain=audioContext.createGain();
   osc.type='square';osc.frequency.setValueAtTime(i===1?660:880,t+offset);
   gain.gain.setValueAtTime(.0001,t+offset);
   gain.gain.linearRampToValueAtTime(.10,t+offset+.018);
   gain.gain.exponentialRampToValueAtTime(.0001,t+offset+.15);
   osc.connect(gain);gain.connect(audioContext.destination);
   osc.start(t+offset);osc.stop(t+offset+.16);
  });
 }catch(e){}
}
function startAlarm(){
 alarmActive=true;
 $('timeupOverlay').classList.add('visible');
 $('timeupOverlay').focus({preventScroll:true});
 unlockAudio();
 alarmChime();
 if(!alarmLoop)alarmLoop=setInterval(alarmChime,1600);
}
function stopAlarm(){
 alarmActive=false;
 if(alarmLoop){clearInterval(alarmLoop);alarmLoop=null}
 $('timeupOverlay').classList.remove('visible');
}
function dismissAlarm(){
 stopAlarm();
 completed=false;remaining=selected;running=false;
 $('status').textContent='';
 persist();show();
}
$('timeupOverlay').addEventListener('click',dismissAlarm);
$('timeupOverlay').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dismissAlarm()}});

const two=n=>String(n).padStart(2,'0');
const format=seconds=>{const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${two(h)}:${two(m)}:${two(s)}`:`${two(m)}:${two(s)}`};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({version:2,selected,remaining,running,endAt,completed}))}catch(e){}}
function show(){
 $('clock').textContent=format(remaining);
 $('start').textContent=running?'Pause timer':remaining<selected&&remaining>0?'Resume timer':'Start timer';
 $('subtitle').textContent=completed?'Focus session complete!':running?'Stay focused. One thing at a time.':'Choose a duration. Make room for one thing.';
 $('center').classList.toggle('finished',completed);
 document.querySelectorAll('[data-minutes]').forEach(b=>{const active=Number(b.dataset.minutes)*60===selected;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
 const custom=![5,15,25].includes(selected/60);$('custom').classList.toggle('active',custom);
 $('custom').setAttribute('aria-pressed',String(custom));
 document.title=$('clock').textContent+' | PORD-01 Focus Timer';
}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=740;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.52);setTimeout(()=>ctx.close(),700)}catch(e){}}
function tick(){if(!running)return;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));if(remaining===0){running=false;completed=true;clearInterval(interval);interval=null;$('status').textContent='Time is up!'}show();persist()}
function startInterval(){clearInterval(interval);interval=setInterval(tick,250)}
function startPause(){unlockAudio();if(completed){remaining=selected;completed=false}if(running){tick();running=false;clearInterval(interval);interval=null;$('status').textContent='Timer paused.'}else{if(remaining<=0)remaining=selected;running=true;endAt=Date.now()+remaining*1000;startInterval();$('status').textContent=''}persist();show()}
function reset(){stopAlarm();running=false;completed=false;clearInterval(interval);interval=null;remaining=selected;$('status').textContent='';persist();show()}
function choose(seconds){selected=seconds;reset()}
document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.minutes)*60));
$('start').onclick=startPause;$('reset').onclick=reset;
// Wheel rows have fixed height; padding rows place the chosen value at center.
const wheelData=[{id:'wheelHours',max:23},{id:'wheelMinutes',max:59},{id:'wheelSeconds',max:59}];
function wheelHeight(el){return el.querySelector('.wheel-item').getBoundingClientRect().height||74}
function wheelIndex(el,max){return Math.max(0,Math.min(max,Math.round(el.scrollTop/wheelHeight(el))))}
function fillWheel(config){const el=$(config.id);el.innerHTML='<div class="wheel-item" aria-hidden="true"></div>'+Array.from({length:config.max+1},(_,i)=>`<div class="wheel-item" data-value="${i}">${two(i)}</div>`).join('')+'<div class="wheel-item" aria-hidden="true"></div>';el.querySelectorAll('[data-value]').forEach(row=>row.onclick=()=>el.scrollTo({top:Number(row.dataset.value)*wheelHeight(el),behavior:'smooth'}))}
wheelData.forEach(fillWheel);
function setWheel(id,n){const el=$(id);el.scrollTop=n*wheelHeight(el)}
function openWheel(){
 $('wheelModal').classList.add('open');
 const h=Math.floor(selected/3600),m=Math.floor(selected%3600/60),s=selected%60;
 setWheel('wheelHours',h);setWheel('wheelMinutes',m);setWheel('wheelSeconds',s);
}
function closeWheel(){$('wheelModal').classList.remove('open')}
$('custom').onclick=openWheel;
$('wheelCancel').onclick=closeWheel;
$('wheelModal').onclick=e=>{if(e.target===$('wheelModal'))closeWheel()};
$('wheelSet').onclick=()=>{
 const seconds=wheelIndex($('wheelHours'),23)*3600+wheelIndex($('wheelMinutes'),59)*60+wheelIndex($('wheelSeconds'),59);
 if(seconds<1){$('status').textContent='Choose a duration greater than zero.';return}
 closeWheel();choose(seconds);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWheel()});
try{
 const saved=JSON.parse(localStorage.getItem(storageKey)||'null');
 if(saved){const seconds=saved.version===2?Number(saved.selected):Number(saved.selected)*60;
 if(Number.isFinite(seconds)&&seconds>=1&&seconds<=86399){selected=seconds;remaining=Math.max(0,Math.min(selected,Number(saved.remaining)||0));completed=!!saved.completed;running=!!saved.running;endAt=Number(saved.endAt)||0;if(running){startInterval();tick()}else if(completed){remaining=0}}}
}catch(e){}
show();document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();}});window.addEventListener('pagehide',persist);
document.addEventListener('pord-timer-dismissed',()=>{stopAlarm();completed=false;running=false;remaining=selected;endAt=0;show()});
</script><script src="pord-timer-alert.js"></script>
</body></html>
