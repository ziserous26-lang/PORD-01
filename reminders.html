<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09141e"><title>PORD-01 | Reminders</title>
<style>
:root{color-scheme:dark;--bg:#09141e;--panel:#101e2a;--border:#4b5b68;--muted:#b7c4d2;--blue:#1678ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#f7f9fc;background:radial-gradient(ellipse at 55% 40%,#142431,#09141e 78%)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:14px 25px 20px;gap:12px;overflow:hidden}.header{height:63px;flex:none;display:flex;align-items:flex-start;justify-content:space-between}.brand{font-weight:800;font-size:34px;letter-spacing:-.6px}.dash{border:2px solid #e7edf4;border-radius:16px;background:transparent;color:white;padding:12px 23px;min-height:51px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:12px}.dash svg{width:26px;height:26px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;flex:none}.intro h1{font-size:37px;line-height:1.1;margin:0 0 7px}.intro p{font-size:18px;color:var(--muted);margin:0}.tools{display:flex;gap:15px;align-items:center;min-width:0}.search{display:flex;align-items:center;gap:12px;background:#162532;border:1.5px solid var(--border);border-radius:13px;padding:0 14px;width:370px;height:46px}.search svg{width:21px;height:21px;color:#c5d3e0;flex:none}.search input{background:none;border:0;outline:none;color:white;width:100%;font-size:17px}.search input::placeholder{color:#c0ccd7}.sort{height:46px;border:1.5px solid var(--border);border-radius:13px;background:#162532;color:#e5edf5;padding:0 13px;max-width:170px}.content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(265px,29%) minmax(0,1fr);gap:27px}.sidebar{border:1.5px solid var(--border);border-radius:20px;padding:19px;display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:rgba(9,21,31,.42)}.new{background:#1479ff;color:#fff;border:0;border-radius:13px;min-height:58px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}.new span{font-size:32px;font-weight:300;line-height:1}.filter{border:0;background:transparent;color:#e8edf5;display:flex;align-items:center;gap:14px;padding:9px 12px;min-height:43px;width:100%;text-align:left;border-radius:12px;font-size:17px}.filter.active{background:#193655;font-weight:700}.filter svg{width:21px;height:21px;flex:none}.filter .count{margin-left:auto;color:#dce7f1}.rule{height:1px;background:#4c5c67;margin:12px 0 16px}.side-title{font-weight:700;font-size:19px;margin:0 12px 10px}.swatch{width:20px;height:20px;border-radius:5px;flex:none}.list-area{min-height:0;overflow-y:auto;padding:2px 1px 12px;scrollbar-color:#526574 transparent}.reminder-list{display:flex;flex-direction:column;gap:13px}.item{--accent:#1684ff;display:grid;grid-template-columns:6px 49px minmax(150px,1.3fr) minmax(150px,.95fr) minmax(105px,.65fr) 48px 31px;align-items:center;gap:13px;min-height:91px;border:1.5px solid #4c5c68;border-radius:16px;overflow:hidden;background:rgba(12,24,35,.78);padding:0 13px 0 0}.accent{height:100%;background:var(--accent)}.item-icon{width:47px;height:47px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:color-mix(in srgb,var(--accent) 27%,#0e1c29);color:var(--accent);font-size:25px}.item-main{min-width:0}.item-title{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-note{font-size:15px;color:#d3dbe4;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.when{font-size:16px;color:#e5edf5;line-height:1.5}.tag{justify-self:start;border-radius:10px;padding:8px 11px;background:color-mix(in srgb,var(--accent) 30%,#0c1b28);color:color-mix(in srgb,var(--accent) 52%,white);font-size:15px;font-weight:700;white-space:nowrap}.toggle{width:46px;height:29px;background:#455364;border:0;border-radius:30px;position:relative;padding:3px;justify-self:center}.toggle:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .18s}.toggle.on{background:#1479ff}.toggle.on:before{transform:translateX(17px)}.menu{background:none;border:0;color:#aab9c7;font-size:25px;line-height:1;padding:5px}.item.off{opacity:.55}.empty{padding:45px 20px;text-align:center;color:#c8d5e0;border:1px dashed #536372;border-radius:16px}.status{font-size:12px;color:#c8d5e0;min-height:15px;flex:none}.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.open{display:flex}.modal{width:min(540px,96vw);max-height:95vh;overflow:auto;background:#142432;border:1.5px solid #647583;border-radius:19px;padding:24px;box-shadow:0 15px 60px #0009}.modal h2{margin:0 0 17px;font-size:26px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#d3dfeb}.field.wide{grid-column:1/-1}.field input,.field textarea,.field select{background:#0b1925;border:1px solid #536675;border-radius:9px;color:#fff;padding:10px;min-width:0}.field textarea{resize:vertical;min-height:64px}.checks{display:flex;align-items:center;gap:9px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:19px}.action{border:1px solid #697c89;border-radius:10px;padding:10px 17px;background:#243545;color:white}.action.primary{background:#1479ff;border-color:#1479ff;font-weight:700}.action.danger{margin-right:auto;color:#ffc3c3}.hidden{display:none!important}
@media(min-width:1000px) and (orientation:landscape){.app{padding:13px 25px 18px;gap:10px}.header{height:60px}.intro{min-height:90px}.content{gap:27px}.sidebar{padding:18px}.reminder-list{gap:12px}.item{min-height:90px}}
@media(max-width:1100px){.item{grid-template-columns:5px 43px minmax(115px,1fr) minmax(115px,.8fr) 92px 42px 25px;gap:8px}.item-title{font-size:17px}.when{font-size:14px}.tag{font-size:13px;padding:7px}.search{width:280px}}
@media(max-width:760px){.app{height:auto;min-height:100dvh;overflow:visible;padding:14px;gap:13px}.header{height:auto}.brand{font-size:26px}.dash{font-size:15px;padding:8px 11px;min-height:40px}.intro{display:block}.intro h1{font-size:31px}.intro p{font-size:15px}.tools{margin-top:15px}.search{flex:1;width:auto}.sort{width:140px}.content{display:block}.sidebar{margin-bottom:15px;padding:12px}.list-area{overflow:visible}.item{grid-template-columns:5px 37px minmax(0,1fr) 43px 25px;min-height:84px;gap:8px}.item-icon{width:35px;height:35px;font-size:19px}.when,.tag{display:none}.item-title{font-size:16px}.item-note{font-size:13px}.status{margin-top:10px}}
</style></head><body><div class="app"><header class="header"><div class="brand">PORD-01</div><a class="dash" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4"/></svg>Dashboard</a></header><section class="intro"><div><h1>Reminders</h1><p>Set it, customize it, and never miss it.</p></div><div class="tools"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 6 6"/></svg><input id="search" placeholder="Search reminders..." aria-label="Search reminders"></label><select class="sort" id="sort" aria-label="Sort reminders"><option value="asc">Sort: Date ↑</option><option value="desc">Sort: Date ↓</option><option value="title">Sort: Name</option></select></div></section><div class="content"><aside class="sidebar"><button class="new" id="new"><span>＋</span>New reminder</button><button class="filter active" data-filter="all">♧ &nbsp; All reminders <span class="count" id="count-all">0</span></button><button class="filter" data-filter="today">▣ &nbsp; Today <span class="count" id="count-today">0</span></button><button class="filter" data-filter="upcoming">▣ &nbsp; Upcoming <span class="count" id="count-upcoming">0</span></button><button class="filter" data-filter="recurring">↻ &nbsp; Recurring <span class="count" id="count-recurring">0</span></button><div class="rule"></div><div class="side-title">Categories</div><div id="categories"></div></aside><main class="list-area"><div class="reminder-list" id="list"><div class="empty">Loading reminders…</div></div></main></div><div class="status" id="status" role="status"></div></div>
<div class="modal-back" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">New reminder</h2><form id="form"><div class="fields"><label class="field wide">Reminder title<input id="title" required maxlength="150" placeholder="e.g. Take out the trash"></label><label class="field wide">Notes<textarea id="notes" maxlength="1000" placeholder="Optional details"></textarea></label><label class="field">Date<input id="date" type="date" required></label><label class="field">Time<input id="time" type="time" value="09:00" required></label><label class="field">Category<select id="category"><option>Projects</option><option>Personal</option><option>Birthdays</option><option>Events</option><option>Maintenance</option></select></label><label class="field">Repeat<select id="repeat"><option value="none">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select></label><label class="field wide checks"><input id="enabled" type="checkbox" checked> Reminder enabled</label></div><div class="actions"><button type="button" class="action danger hidden" id="delete">Delete</button><button type="button" class="action" id="cancel">Cancel</button><button type="submit" class="action primary" id="save">Save reminder</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const SUPABASE_URL='https://xxsxhxuaxhvfhpgodhnk.supabase.co';
const SUPABASE_KEY='sb_publishable_zdPwmxzkFiMTyGqaW0w15Q_iT4RAILn';
const db=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const colors={Projects:'#25bf63',Personal:'#208cff',Birthdays:'#b75cf1',Events:'#e6b900',Maintenance:'#f44343'};
const icons={Projects:'▣',Personal:'●',Birthdays:'♔',Events:'▦',Maintenance:'⚒'};
let user=null,reminders=[],filter='all',editing=null;
function localDate(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function today(){return localDate(new Date())}
function nextDue(r){let d=new Date(r.due_at);if(isNaN(d))return new Date(8640000000000000);const now=new Date();if(r.recurrence==='none')return d;let limit=0;while(d<now&&limit++<5000){switch(r.recurrence){case'daily':d.setDate(d.getDate()+1);break;case'weekly':d.setDate(d.getDate()+7);break;case'monthly':{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));break}case'yearly':d.setFullYear(d.getFullYear()+1);break;default:return d}}return d}
function isToday(r){return localDate(nextDue(r))===today()}
function isUpcoming(r){return localDate(nextDue(r))>today()}
function fmt(r){const d=nextDue(r);if(isNaN(d))return 'No date';const time=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});if(r.recurrence==='daily')return 'Every day · '+time;if(r.recurrence==='weekly')return 'Every '+d.toLocaleDateString('en-US',{weekday:'long'})+' · '+time;if(r.recurrence==='monthly')return 'Every month · '+time;if(r.recurrence==='yearly')return 'Every year · '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'});const day=localDate(d)===today()?'Today':d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});return day+' · '+time}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visible(r){if(filter==='today')return isToday(r);if(filter==='upcoming')return isUpcoming(r);if(filter==='recurring')return r.recurrence!=='none';if(filter.startsWith('cat:'))return r.category===filter.slice(4);return true}
function render(){const counts={all:reminders.length,today:reminders.filter(isToday).length,upcoming:reminders.filter(isUpcoming).length,recurring:reminders.filter(r=>r.recurrence!=='none').length};Object.keys(counts).forEach(k=>{if($('count-'+k))$('count-'+k).textContent=counts[k]});$('categories').innerHTML=Object.keys(colors).map(c=>`<button class="filter ${filter==='cat:'+c?'active':''}" data-filter="cat:${c}"><span class="swatch" style="background:${colors[c]}"></span>${c}<span class="count">${reminders.filter(r=>r.category===c).length}</span></button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.onclick=()=>{filter=b.dataset.filter;render()}});let data=reminders.filter(visible).filter(r=>(r.title+' '+(r.notes||'')+' '+r.category).toLowerCase().includes($('search').value.trim().toLowerCase()));const sort=$('sort').value;data.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='desc'?nextDue(b)-nextDue(a):nextDue(a)-nextDue(b));$('list').innerHTML=data.length?data.map(r=>{const c=colors[r.category]||colors.Personal;return `<article class="item ${r.enabled?'':'off'}" style="--accent:${c}"><div class="accent"></div><div class="item-icon">${icons[r.category]||'●'}</div><div class="item-main"><div class="item-title">${safe(r.title)}</div><div class="item-note">${safe(r.notes||'')}</div></div><div class="when">${safe(fmt(r))}</div><span class="tag">${safe(r.category)}</span><button class="toggle ${r.enabled?'on':''}" aria-label="${r.enabled?'Disable':'Enable'} ${safe(r.title)}" data-toggle="${r.id}"></button><button class="menu" data-edit="${r.id}" aria-label="Edit ${safe(r.title)}">⋮</button></article>`}).join(''):'<div class="empty">No reminders here yet. Select “New reminder” to add one.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(reminders.find(r=>r.id===b.dataset.edit)));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle))}
function openForm(r){editing=r?r.id:null;$('modal-title').textContent=r?'Edit reminder':'New reminder';$('title').value=r?r.title:'';$('notes').value=r?r.notes||'':'';const d=r?new Date(r.due_at):new Date();if(!r)d.setDate(d.getDate()+1);$('date').value=localDate(d);$('time').value=r?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'09:00';$('category').value=r?r.category:'Personal';$('repeat').value=r?r.recurrence:'none';$('enabled').checked=r?r.enabled:true;$('delete').classList.toggle('hidden',!r);$('modal').classList.add('open');$('title').focus()}
function closeForm(){$('modal').classList.remove('open');editing=null}
function status(s){$('status').textContent=s}
async function load(){if(!db){status('Unable to load Supabase. Check the internet connection.');$('list').innerHTML='<div class="empty">Connection unavailable.</div>';return}try{const {data:{session},error:e}=await db.auth.getSession();if(e)throw e;if(!session){status('Sign in to PORD-01 to access reminders.');$('list').innerHTML='<div class="empty">Please sign in from the PORD-01 login page.</div>';return}user=session.user;const {data,error}=await db.from('reminders').select('id,title,notes,due_at,category,recurrence,enabled').eq('user_id',user.id).order('due_at',{ascending:true});if(error)throw error;reminders=data||[];status('');render()}catch(e){status('Reminders could not load: '+e.message);$('list').innerHTML='<div class="empty">Check that the reminders table has been created in Supabase.</div>'}}
async function toggle(id){const r=reminders.find(x=>x.id===id);if(!r||!user)return;const value=!r.enabled;const {error}=await db.from('reminders').update({enabled:value}).eq('id',id).eq('user_id',user.id);if(error){status(error.message);return}r.enabled=value;status('');render()}
$('form').onsubmit=async e=>{e.preventDefault();if(!user){status('Please sign in first.');return}const due=new Date($('date').value+'T'+$('time').value+':00');if(isNaN(due)){status('Enter a valid date and time.');return}const payload={title:$('title').value.trim(),notes:$('notes').value.trim(),due_at:due.toISOString(),category:$('category').value,recurrence:$('repeat').value,enabled:$('enabled').checked};if(!payload.title)return;$('save').disabled=true;try{let q=editing?db.from('reminders').update(payload).eq('id',editing).eq('user_id',user.id):db.from('reminders').insert({...payload,user_id:user.id});const {error}=await q;if(error)throw error;closeForm();await load()}catch(e){status('Could not save: '+e.message)}finally{$('save').disabled=false}};
$('delete').onclick=async()=>{if(!editing||!user)return;if(!confirm('Delete this reminder?'))return;const {error}=await db.from('reminders').delete().eq('id',editing).eq('user_id',user.id);if(error){status(error.message);return}closeForm();await load()};$('new').onclick=()=>openForm(null);$('cancel').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};$('search').oninput=render;$('sort').onchange=render;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});load();
</script><script src="pord-timer-alert.js"></script>
</body></html>
