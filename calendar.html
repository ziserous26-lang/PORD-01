<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PORD-01 | Calendar</title><style>
:root{color-scheme:dark;--bg:#0b151e;--line:#44525e;--text:#f7f8fb;--muted:#c0cbd5}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 45% 45%,#1a2631,#0b151e 85%);font:16px Arial,Helvetica,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;gap:13px;padding:15px 35px 22px;overflow:hidden}.top{display:flex;align-items:center;gap:26px;flex:none;min-height:56px;border-bottom:1px solid #3a4651;padding-bottom:11px}.brand{font-size:32px;font-weight:800;white-space:nowrap}.crumb{font-weight:700;color:#b8c4d0}.crumb b{color:white}.grow{flex:1}.search{width:300px;max-width:26vw;border:0;border-radius:18px;background:#29333e;color:white;padding:12px 17px;outline:1px solid transparent}.search:focus{outline-color:#7c94b1}.nav{border:2px solid #e6edf4;border-radius:15px;min-width:174px;min-height:47px;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:19px}.nav svg{width:22px;height:22px}.calendars{display:flex;align-items:center;justify-content:space-between;gap:15px;flex:none;min-height:84px}.calendars h2{margin:0 0 9px;font-size:23px}.chips{display:flex;gap:18px;flex-wrap:wrap}.chip{border:0;border-radius:20px;min-width:96px;padding:7px 19px;color:#132333;font-weight:700;opacity:.48}.chip.on{opacity:1;box-shadow:0 0 0 2px #ffffff45}.chip.family{background:#ffd5bb}.chip.projects{background:#b8d2ff}.chip.reminders{background:#e8cffb}.chip.sports{background:#b3ebd0}.new{background:#1764ff;color:white;border:0;border-radius:13px;padding:14px 24px;font-weight:700;font-size:17px;white-space:nowrap}.controls{display:flex;align-items:center;gap:12px;flex:none;min-height:61px}.month-name{font-size:37px;font-weight:800;margin-right:18px;min-width:285px}.square,.today,.mode{background:#222d38;color:white;border:1px solid #44525f;border-radius:11px;padding:10px 15px;font-weight:700}.square{min-width:45px}.today{padding:10px 22px}.mode-wrap{display:flex;margin-left:auto;border:1px solid #71808e;border-radius:12px;overflow:hidden}.mode{border:0;border-radius:0;min-width:88px}.mode.active{background:#414e71}.calendar{flex:1;min-height:0;display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:18px;padding:0 10px 10px;overflow:hidden;background:#ffffff05}.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:none;height:45px;border-bottom:1px solid #42505c}.weekdays div{text-align:center;padding:12px 0;font-weight:800;font-size:14px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr));flex:1;min-height:0}.day{border:0;border-bottom:1px solid #384651;background:transparent;color:white;min-width:0;min-height:0;padding:8px 7px;display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left;overflow:hidden}.day:not(:nth-child(7n)){border-right:1px solid #ffffff08}.day.out{opacity:.32}.day.today-cell .number{background:#2c70ff;border-radius:100px;padding:5px 9px}.number{font-size:18px;font-weight:700;align-self:flex-start}.entry{border:0;border-radius:7px;color:#101b27;text-align:left;padding:6px 8px;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;flex:none}.entry.family{background:#ffd1b5}.entry.projects{background:#b5d1fa}.entry.reminders{background:#dec4f2}.entry.sports{background:#a9e3c6}.more{color:#b9c9d8;font-size:12px}.day:focus-visible,.entry:focus-visible{outline:2px solid #74a8ff}.week-mode .days{grid-template-rows:minmax(0,1fr)}.week-mode .day{border-bottom:0}.status{position:absolute;bottom:2px;left:35px;color:#ffc6c6;font-size:12px;pointer-events:none}.backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}.backdrop.open{display:flex}.dialog{background:#152532;border:1px solid #697887;border-radius:18px;padding:22px;width:min(520px,96vw);max-height:95vh;overflow:auto}.dialog h2{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-size:14px}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{background:#0c1a26;border:1px solid #5a6a77;color:white;border-radius:8px;padding:10px;min-width:0}.field textarea{resize:vertical;min-height:60px}.buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:17px}.buttons button{border-radius:9px;padding:10px 17px;background:#2b3c4a;color:white;border:1px solid #687786}.buttons .save{background:#1764ff;border-color:#1764ff}.buttons .danger{margin-right:auto;background:#712a31}.hidden{display:none!important}@media(max-width:800px){.app{padding:10px;gap:8px}.top{gap:10px}.brand{font-size:23px}.crumb{display:none}.search{width:170px}.nav{font-size:14px;min-width:110px}.calendars{min-height:75px}.chips{gap:6px}.chip{min-width:0;padding:6px 10px}.month-name{font-size:25px;min-width:0;margin-right:auto}.controls{gap:6px}.day{padding:5px 3px}.number{font-size:15px}.entry{font-size:11px;padding:4px}}
</style></head><body><div class="app"><header class="top"><div class="brand">PORD-01</div><div class="crumb">Your home &nbsp;/&nbsp; <b>Calendar</b></div><div class="grow"></div><input class="search" id="search" placeholder="⌕  Search your calendar" aria-label="Search events"><a class="nav" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 22h8M12 18v4"/></svg>Dashboard</a></header><section class="calendars"><div><h2>Your calendars</h2><div class="chips"><button class="chip family on" data-cat="family">Family</button><button class="chip projects on" data-cat="projects">Projects</button><button class="chip reminders on" data-cat="reminders">Reminders</button><button class="chip sports on" data-cat="sports">Sports</button></div></div><button class="new" id="new">＋ &nbsp; New event</button></section><section class="controls"><div class="month-name" id="heading"></div><button class="square" id="prev" aria-label="Previous">‹</button><button class="square" id="next" aria-label="Next">›</button><button class="today" id="today">Today</button><div class="mode-wrap"><button class="mode active" data-mode="month">Month</button><button class="mode" data-mode="week">Week</button></div></section><main class="calendar" id="calendar"><div class="weekdays"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div><div class="days" id="days"></div></main><div class="status" id="status" role="status"></div></div><div class="backdrop" id="modal"><div class="dialog"><h2 id="dialogTitle">New event</h2><form id="form"><div class="form-grid"><label class="field wide">Title<input id="title" required maxlength="150"></label><label class="field">Date<input type="date" id="date" required></label><label class="field">Time (optional)<input type="time" id="time"></label><label class="field">Calendar<select id="category"><option value="Family">Family</option><option value="Sports">Sports</option><option value="Projects">Projects</option></select></label><label class="field wide">Notes<textarea id="notes"></textarea></label></div><div class="buttons"><button type="button" class="danger hidden" id="delete">Delete</button><button type="button" id="cancel">Cancel</button><button class="save" id="save" type="submit">Save event</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const db=window.supabase?window.supabase.createClient('https://xxsxhxuaxhvfhpgodhnk.supabase.co','sb_publishable_zdPwmxzkFiMTyGqaW0w15Q_iT4RAILn'):null;const pick=(x,ks)=>{for(const k of ks)if(x&&x[k]!=null&&x[k]!=='')return x[k];return null};const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=x=>String(x).padStart(2,'0');const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const parse=v=>{if(!v)return null;const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v))?v+'T12:00:00':v);return isNaN(d)?null:d};let user=null,events=[],view=new Date(),mode='month',filters=new Set(['family','projects','reminders','sports']),editing=null;view.setHours(12,0,0,0);
function eventDate(r){return parse(pick(r,['start_date','start_time','event_date','date','starts_at','datetime','due_at']))}function item(title,date,cat,source,id,notes='',raw=null){if(date&&!isNaN(date))return {title:String(title),date,cat,source,id,notes,raw};return null}function status(s){$('status').textContent=s||''}
function expand(){const out=[];for(const r of events){if(r.source==='birthday'){const birth=r.date;for(let y=view.getFullYear()-1;y<=view.getFullYear()+1;y++){let d=new Date(y,birth.getMonth(),birth.getDate(),12);out.push({...r,date:d})}}else if(r.source==='reminder'&&r.raw.recurrence!=='none'){const base=r.date;for(let delta=-1;delta<=2;delta++){let year=view.getFullYear()+delta;if(r.raw.recurrence==='yearly'){out.push({...r,date:new Date(year,base.getMonth(),base.getDate(),12)});}else{let start=new Date(view.getFullYear(),view.getMonth()-1,1,12),end=new Date(view.getFullYear(),view.getMonth()+2,1,12);let d=new Date(base);let count=0;while(d<start&&count++<10000){advance(d,r.raw.recurrence)}while(d<end&&count++<10000){out.push({...r,date:new Date(d)});advance(d,r.raw.recurrence)}}}}else out.push(r)}return out}
function advance(d,rec){if(rec==='daily')d.setDate(d.getDate()+1);else if(rec==='weekly')d.setDate(d.getDate()+7);else if(rec==='monthly')d.setMonth(d.getMonth()+1);else if(rec==='yearly')d.setFullYear(d.getFullYear()+1)}
function render(){const first=new Date(view.getFullYear(),view.getMonth(),1,12),start=new Date(first);if(mode==='month'){start.setDate(1-first.getDay());$('heading').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}else{start.setDate(view.getDate()-view.getDay());$('heading').textContent=start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+new Date(start.getFullYear(),start.getMonth(),start.getDate()+6).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}const count=mode==='week'?7:Math.ceil((first.getDay()+new Date(first.getFullYear(),first.getMonth()+1,0).getDate())/7)*7;const rows=count/7;$('days').style.setProperty('--rows',rows);$('calendar').classList.toggle('week-mode',mode==='week');const all=expand().filter(x=>filters.has(x.cat)&&x.title.toLowerCase().includes($('search').value.trim().toLowerCase()));const buckets={};all.forEach(x=>(buckets[key(x.date)]||(buckets[key(x.date)]=[])).push(x));let html='';for(let i=0;i<count;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),list=(buckets[k]||[]).sort((a,b)=>a.date-b.date),outside=mode==='month'&&d.getMonth()!==first.getMonth();html+=`<div class="day ${outside?'out':''} ${k===key(new Date())?'today-cell':''}" data-date="${k}"><span class="number">${d.getDate()}</span>${list.slice(0,mode==='week'?12:3).map(x=>`<button class="entry ${x.cat}" data-source="${esc(x.source)}" data-id="${esc(x.id)}" title="${esc(x.title)}">${esc(x.date.getHours()!==12||x.date.getMinutes()?x.date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · ':'')}${esc(x.title)}</button>`).join('')}${list.length>(mode==='week'?12:3)?`<span class="more">+${list.length-(mode==='week'?12:3)} more</span>`:''}</div>`} $('days').innerHTML=html;$('days').querySelectorAll('.entry').forEach(b=>b.onclick=()=>{const r=events.find(x=>x.source===b.dataset.source&&String(x.id)===b.dataset.id);if(r&&r.source==='event')openForm(r);else if(r)alert(r.title+'\n'+r.date.toLocaleString()+(r.notes?'\n'+r.notes:''))});$('days').querySelectorAll('.day').forEach(d=>d.addEventListener('dblclick',e=>{if(e.target===d||e.target.classList.contains('number'))openForm(null,d.dataset.date)}))}
async function load(){if(!db){status('Supabase library unavailable.');return}try{const s=await db.auth.getSession();if(s.error)throw s.error;if(!s.data.session){status('Sign in to PORD-01 to load your calendar.');return}user=s.data.session.user;const results=await Promise.allSettled(['events','birthdays','projects','reminders'].map(t=>db.from(t).select('*').eq('user_id',user.id)));events=[];const errors=[];results.forEach((rr,i)=>{if(rr.status==='rejected'){errors.push(rr.reason.message);return}const r=rr.value;if(r.error){errors.push(r.error.message);return}const source=['event','birthday','project','reminder'][i];(r.data||[]).forEach(x=>{let obj;if(source==='event'){const cat=String(pick(x,['category','type','calendar'])||'Family').toLowerCase();obj=item(pick(x,['title','name','event_name'])||'Event',eventDate(x),cat.includes('sport')||cat.includes('game')?'sports':cat.includes('project')?'projects':'family',source,x.id,pick(x,['notes','description'])||'',x)}else if(source==='birthday'){obj=item((pick(x,['name','title','person_name'])||'Someone')+"'s birthday",parse(pick(x,['birth_date','birthday','date','date_of_birth'])),'family',source,x.id,'',x)}else if(source==='project'){obj=item((pick(x,['name','title','project_name'])||'Project')+' due',parse(pick(x,['due_date','due_at','deadline','end_date'])),'projects',source,x.id,'',x)}else if(x.enabled!==false){obj=item(x.title,parse(x.due_at),'reminders',source,x.id,x.notes||'',x)}if(obj)events.push(obj)})});status(errors.length?'Some calendar sources could not load: '+errors.join('; '):'');render()}catch(e){status('Calendar load error: '+e.message)}}
function openForm(r,date){editing=r&&r.source==='event'?r:null;$('dialogTitle').textContent=editing?'Edit event':'New event';$('title').value=editing?editing.title:'';$('date').value=date||(editing?key(editing.date):key(new Date()));$('time').value=editing?pad(editing.date.getHours())+':'+pad(editing.date.getMinutes()):'';$('notes').value=editing?editing.notes:'';$('category').value=editing?(editing.cat==='sports'?'Sports':editing.cat==='projects'?'Projects':'Family'):'Family';$('delete').classList.toggle('hidden',!editing);$('modal').classList.add('open')}
function closeForm(){$('modal').classList.remove('open')}
// The original events table may use different field names. Try known layouts and surface any schema error.
async function saveEvent(payload){const variants=[{title:payload.title,start_date:payload.date,category:payload.category,description:payload.notes},{title:payload.title,date:payload.date,category:payload.category,description:payload.notes},{title:payload.title,start_time:payload.timestamp,category:payload.category,description:payload.notes},{title:payload.title,event_date:payload.date,category:payload.category,notes:payload.notes}];let last=null;for(const data of variants){const q=editing?db.from('events').update(data).eq('id',editing.id).eq('user_id',user.id):db.from('events').insert({...data,user_id:user.id});const res=await q;if(!res.error)return;last=res.error;if(!/column|schema cache|not-null|null value|date\/time field/i.test(last.message))break}throw last}
$('form').onsubmit=async e=>{e.preventDefault();if(!user){status('Sign in before creating an event.');return}const date=$('date').value,time=$('time').value;const d=new Date(date+'T'+(time||'12:00')+':00');if(isNaN(d)){status('Enter a valid date.');return}const payload={title:$('title').value.trim(),date,category:$('category').value,notes:$('notes').value.trim(),timestamp:d.toISOString()};$('save').disabled=true;try{await saveEvent(payload);closeForm();await load()}catch(err){status('Could not save event: '+err.message);alert('Could not save event. Your existing events table may use different columns.\n\n'+err.message)}finally{$('save').disabled=false}};
$('delete').onclick=async()=>{if(!editing||!confirm('Delete this event?'))return;const r=await db.from('events').delete().eq('id',editing.id).eq('user_id',user.id);if(r.error){status(r.error.message);return}closeForm();load()};$('new').onclick=()=>openForm(null);$('cancel').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};$('prev').onclick=()=>{if(mode==='month')view.setMonth(view.getMonth()-1);else view.setDate(view.getDate()-7);render()};$('next').onclick=()=>{if(mode==='month')view.setMonth(view.getMonth()+1);else view.setDate(view.getDate()+7);render()};$('today').onclick=()=>{view=new Date();view.setHours(12,0,0,0);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const cat=b.dataset.cat;if(filters.has(cat))filters.delete(cat);else filters.add(cat);b.classList.toggle('on',filters.has(cat));render()});$('search').oninput=render;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});render();load();
</script></body></html>
