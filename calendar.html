'use strict';const $=id=>document.getElementById(id);const db=window.supabase?window.supabase.createClient('https://xxsxhxuaxhvfhpgodhnk.supabase.co','sb_publishable_zdPwmxzkFiMTyGqaW0w15Q_iT4RAILn'):null;const pick=(x,ks)=>{for(const k of ks)if(x&&x[k]!=null&&x[k]!=='')return x[k];return null};const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=x=>String(x).padStart(2,'0');const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const parse=v=>{if(!v)return null;const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(v))?v+'T12:00:00':v);return isNaN(d)?null:d};let user=null,events=[],view=new Date(),mode='month',filters=new Set(['family','projects','holidays','sports','birthdays']),editing=null;view.setHours(12,0,0,0);
function eventDate(r){return parse(pick(r,['start_date','start_time','event_date','date','starts_at','datetime','due_at']))}function item(title,date,cat,source,id,notes='',raw=null){if(date&&!isNaN(date))return {title:String(title),date,cat,source,id,notes,raw};return null}function status(s){$('status').textContent=s||''}
function expand(){
 const out=[],rangeStart=new Date(view.getFullYear(),view.getMonth()-1,1,12),rangeEnd=new Date(view.getFullYear(),view.getMonth()+2,1,12);
 for(const r of events){
  if(r.source==='birthday'||r.source==='special-birthday'){
   const birth=r.date;
   for(let y=rangeStart.getFullYear();y<=rangeEnd.getFullYear();y++){
    const d=new Date(y,birth.getMonth(),birth.getDate(),12);
    if(d>=rangeStart&&d<rangeEnd)out.push({...r,date:d});
   }
  }else out.push(r);
 }
 // Prevent repeated rows from duplicate sources or overlapping recurrence expansions.
 const seen=new Set();return out.filter(r=>{const k=r.source+'|'+r.id+'|'+key(r.date);if(seen.has(k))return false;seen.add(k);return true});
}
function advance(d,rec){if(rec==='daily')d.setDate(d.getDate()+1);else if(rec==='weekly')d.setDate(d.getDate()+7);else if(rec==='monthly')d.setMonth(d.getMonth()+1);else if(rec==='yearly')d.setFullYear(d.getFullYear()+1)}
function render(){const first=new Date(view.getFullYear(),view.getMonth(),1,12),start=new Date(first);if(mode==='month'){start.setDate(1-first.getDay());$('heading').textContent=first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}else{start.setDate(view.getDate()-view.getDay());$('heading').textContent=start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+new Date(start.getFullYear(),start.getMonth(),start.getDate()+6).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}const count=mode==='week'?7:Math.ceil((first.getDay()+new Date(first.getFullYear(),first.getMonth()+1,0).getDate())/7)*7;const rows=count/7;$('days').style.setProperty('--rows',rows);$('calendar').classList.toggle('week-mode',mode==='week');const all=expand().filter(x=>filters.has(x.cat)&&x.title.toLowerCase().includes($('search').value.trim().toLowerCase()));const buckets={};all.forEach(x=>(buckets[key(x.date)]||(buckets[key(x.date)]=[])).push(x));let html='';for(let i=0;i<count;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),list=(buckets[k]||[]).sort((a,b)=>a.date-b.date),outside=mode==='month'&&d.getMonth()!==first.getMonth();html+=`<div class="day ${outside?'out':''} ${k===key(new Date())?'today-cell':''}" data-date="${k}"><span class="number">${d.getDate()}</span>${list.slice(0,mode==='week'?12:3).map(x=>`<button class="entry ${x.cat}" data-source="${esc(x.source)}" data-id="${esc(x.id)}" title="${esc(x.title)}">${esc(x.source==='event'&&x.raw&&x.raw.event_all_day?'':x.source==='event'&&x.raw&&x.raw.event_start_time?new Date('2000-01-01T'+String(x.raw.event_start_time).slice(0,5)+':00').toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · ':x.date.getHours()!==12||x.date.getMinutes()?x.date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' · ':'')}${esc(x.title)}</button>`).join('')}${list.length>(mode==='week'?12:3)?`<span class="more">+${list.length-(mode==='week'?12:3)} more</span>`:''}</div>`} $('days').innerHTML=html;$('days').querySelectorAll('.entry').forEach(b=>b.onclick=()=>{const r=events.find(x=>x.source===b.dataset.source&&String(x.id)===b.dataset.id);if(r&&(r.source==='event'||r.source.indexOf('special-')===0))openForm(r);else if(r)alert(r.title+'\n'+r.date.toLocaleString()+(r.notes?'\n'+r.notes:''))});$('days').querySelectorAll('.day').forEach(d=>d.addEventListener('dblclick',e=>{if(e.target===d||e.target.classList.contains('number'))openForm(null,d.dataset.date)}))}
async function load(){if(!db){status('Supabase library unavailable.');return}try{const s=await db.auth.getSession();if(s.error)throw s.error;if(!s.data.session){status('Sign in to PORD-01 to load your calendar.');return}user=s.data.session.user;const results=await Promise.allSettled(['events','birthdays','projects','calendar_special_events'].map(t=>db.from(t).select('*').eq('user_id',user.id)));events=[];const errors=[];results.forEach((rr,i)=>{if(rr.status==='rejected'){errors.push(rr.reason.message);return}const r=rr.value;if(r.error){errors.push(r.error.message);return}const source=['event','birthday','project','special'][i];(r.data||[]).forEach(x=>{let obj;if(source==='event'){const cat=String(pick(x,['category','type','calendar'])||'Family').toLowerCase();obj=item(pick(x,['title','name','event_name'])||'Event',eventDate(x),cat.includes('sport')||cat.includes('game')?'sports':cat.includes('holiday')?'holidays':cat.includes('project')?'projects':cat.includes('birthday')?'birthdays':'family',source,x.id,pick(x,['notes','description'])||'',x)}else if(source==='birthday'){obj=item((pick(x,['name','title','person_name'])||'Someone')+"'s birthday",parse(pick(x,['birth_date','birthday','date','date_of_birth'])),'birthdays',source,x.id,'',x)}else if(source==='project'){obj=item((pick(x,['name','title','project_name'])||'Project')+' due',parse(pick(x,['due_date','due_at','deadline','end_date'])),'projects',source,x.id,'',x)}else if(source==='special'){if(x.kind==='birthday'){obj=item(x.person_name+"'s birthday",parse(x.date_of_birth),'birthdays','special-birthday',x.id,'Born '+x.date_of_birth,x)}else if(x.kind==='sports'){obj=item(x.away_team+' @ '+x.home_team,parse(x.starts_at),'sports','special-sports',x.id,'Home: '+x.home_team+'; Away: '+x.away_team,x)}}if(obj)events.push(obj)})});status(errors.length?'Some calendar sources could not load: '+errors.join('; '):'');render()}catch(e){status('Calendar load error: '+e.message)}}
function updateFields(){const kind=$('category').value.toLowerCase();document.querySelectorAll('.kind-family,.kind-birthday,.kind-sports').forEach(el=>el.classList.toggle('hidden',!(el.classList.contains('kind-'+kind)||(kind==='holiday'&&el.classList.contains('kind-family')))));updateAge();updateTimeFields()}

function updateAge(){const d=parse($('dob').value);if(!d){$('age').value='';return}const now=new Date();let age=now.getFullYear()-d.getFullYear();const passed=now.getMonth()>d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()>=d.getDate());$('age').value=age+(passed?1:0)}
$('category').onchange=updateFields;$('dob').onchange=updateAge;$('allDay').onchange=updateTimeFields;
function openForm(r,date){editing=r&&(r.source==='event'||r.source.indexOf('special-')===0)?r:null;const raw=editing?editing.raw:{};const kind=editing?(editing.source==='special-birthday'?'Birthday':editing.source==='special-sports'?'Sports':editing.cat==='sports'?'Sports':editing.cat==='holidays'?'Holiday':'Family'):'Family';$('dialogTitle').textContent=editing?'Edit event':'New event';$('category').value=kind;$('title').value=editing&&(kind==='Family'||kind==='Holiday')?editing.title:'';$('date').value=date||(editing?key(editing.date):key(new Date()));$('allDay').checked=editing?raw.event_all_day===true:false;$('time').value=editing?(raw.event_start_time?String(raw.event_start_time).slice(0,5):(!raw.event_all_day&&editing.date.getHours()!==12?pad(editing.date.getHours())+':'+pad(editing.date.getMinutes()):'')):'';$('endTime').value=editing&&raw.event_end_time?String(raw.event_end_time).slice(0,5):'';$('notes').value=editing?editing.notes:'';$('person').value=raw.person_name||'';$('dob').value=raw.date_of_birth||'';$('homeTeam').value=raw.home_team||'';$('awayTeam').value=raw.away_team||'';$('gameDate').value=raw.starts_at?key(parse(raw.starts_at)):(date||key(new Date()));$('gameTime').value=raw.starts_at?pad(parse(raw.starts_at).getHours())+':'+pad(parse(raw.starts_at).getMinutes()):'19:00';$('delete').classList.toggle('hidden',!editing);updateFields();updateTimeFields();$('modal').classList.add('open')}

// The original events table may use different field names. Try known layouts and surface any schema error.
async function saveEvent(payload){
 const data={title:payload.title,start_date:payload.date,category:payload.category,description:payload.notes,event_all_day:payload.allDay,event_start_time:payload.startTime||null,event_end_time:payload.endTime||null};
 // Existing installations can have a different date/description column layout.
 const variants=[data,{...data,date:data.start_date,start_date:undefined},{...data,event_date:data.start_date,start_date:undefined,notes:data.description,description:undefined},{...data,start_time:payload.timestamp,start_date:undefined}];
 let last=null;
 for(const variant of variants){const clean={};Object.keys(variant).forEach(k=>{if(variant[k]!==undefined)clean[k]=variant[k]});
 const q=editing?db.from('events').update(clean).eq('id',editing.id).eq('user_id',user.id):db.from('events').insert({...clean,user_id:user.id});
 const res=await q;if(!res.error)return;last=res.error;
 if(!/column|schema cache|not-null|null value|date\/time field/i.test(last.message))break;
 }

}
$('form').onsubmit=async e=>{e.preventDefault();if(!user){status('Sign in before creating an event.');return}const kind=$('category').value;$('save').disabled=true;try{
 if(kind==='Birthday'||kind==='Sports'){

  if(kind==='Birthday'){
   const person=$('person').value.trim(),dob=$('dob').value;if(!person||!dob)throw Error('Enter a name and date of birth.');if(parse(dob)>new Date())throw Error('Date of birth cannot be in the future.');
   data={kind:'birthday',person_name:person,date_of_birth:dob,home_team:null,away_team:null,starts_at:null};
  }else{
   const home=$('homeTeam').value.trim(),away=$('awayTeam').value.trim(),date=$('gameDate').value,time=$('gameTime').value;
   if(!home||!away||!date||!time)throw Error('Enter both teams, game date, and start time.');
   data={kind:'sports',person_name:null,date_of_birth:null,home_team:home,away_team:away,starts_at:new Date(date+'T'+time+':00').toISOString()};
  }
  let q;if(editing&&editing.source.indexOf('special-')===0){q=db.from('calendar_special_events').update(data).eq('id',editing.id).eq('user_id',user.id)}else{q=db.from('calendar_special_events').insert({...data,user_id:user.id})}
  const result=await q;if(result.error)throw result.error;
  // If changing an existing ordinary event into a special type, remove the original after saving.
  if(editing&&editing.source==='event'){const old=await db.from('events').delete().eq('id',editing.id).eq('user_id',user.id);if(old.error)throw old.error}
 }else{
  const date=$('date').value,allDay=$('allDay').checked,time=allDay?'':$('time').value,endTime=allDay?'':$('endTime').value;if(!$('title').value.trim()||!date)throw Error('Enter an event title and date.');if(!allDay&&!time)throw Error('Enter a start time or select All-day event.');if(endTime&&endTime<=time)throw Error('End time must be later than start time.');const d=new Date(date+'T'+(time||'12:00')+':00');if(isNaN(d))throw Error('Enter a valid date.');
   const payload={title:$('title').value.trim(),date,category:kind,notes:$('notes').value.trim(),timestamp:d.toISOString(),allDay,startTime:time,endTime};
   if(editing&&editing.source.indexOf('special-')===0){const old=editing;editing=null;await saveEvent(payload);const del=await db.from('calendar_special_events').delete().eq('id',old.id).eq('user_id',user.id);if(del.error)throw del.error}
  else await saveEvent(payload);

 closeForm();await load();
 }catch(err){status('Could not save event: '+err.message);alert('Could not save event.\n\n'+err.message+'\n\nFor birthdays and sports, make sure you have run the calendar SQL setup.')}finally{$('save').disabled=false}};
$('delete').onclick=async()=>{if(!editing||!confirm('Delete this event?'))return;const table=editing.source.indexOf('special-')===0?'calendar_special_events':'events';const r=await db.from(table).delete().eq('id',editing.id).eq('user_id',user.id);if(r.error){status(r.error.message);return}closeForm();load()};
$('new').onclick=()=>openForm(null);$('cancel').onclick=closeForm;$('modal').onclick=e=>{if(e.target===$('modal'))closeForm()};$('prev').onclick=()=>{if(mode==='month')view.setMonth(view.getMonth()-1);else view.setDate(view.getDate()-7);render()};$('next').onclick=()=>{if(mode==='month')view.setMonth(view.getMonth()+1);else view.setDate(view.getDate()+7);render()};$('today').onclick=()=>{view=new Date();view.setHours(12,0,0,0);render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const cat=b.dataset.cat;if(filters.has(cat))filters.delete(cat);else filters.add(cat);b.classList.toggle('on',filters.has(cat));render()});$('search').oninput=render;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});render();load();
</script></body></html>
