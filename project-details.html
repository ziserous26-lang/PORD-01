<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PORD-01 | Project Details</title><style>
:root{color-scheme:dark;--bg:#09141e;--panel:#101e2a;--border:#536370;--muted:#c2ceda;--green:#9bf5ce;--yellow:#ffe276;--red:#ff858b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(ellipse at 55% 45%,#162632,#09141e 80%);color:#f7f9fc;font-family:Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:14px 28px 19px;gap:14px}.top{height:61px;flex:none;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:35px;font-weight:800}.nav{display:flex;align-items:center;justify-content:center;gap:12px;border:2px solid #f1f5fa;border-radius:16px;min-height:55px;min-width:195px;padding:8px 18px;background:transparent;color:#fff;font-size:21px;font-weight:700}.nav svg{width:25px;height:25px}.muted{color:var(--muted)}.intro{flex:none}.intro h1{font-size:39px;margin:0 0 5px}.intro p{font-size:19px;margin:0}.panel{background:rgba(16,29,40,.65);border:1.5px solid var(--border);border-radius:19px}.status{font-size:12px;min-height:15px;color:#b9c8d4}.scroll{overflow-y:auto;min-height:0;scrollbar-color:#536574 transparent}.green{--accent:var(--green);--accent-bg:rgba(31,126,85,.2);--edge:#62b990}.yellow{--accent:var(--yellow);--accent-bg:rgba(133,112,38,.22);--edge:#e4c651}.red{--accent:var(--red);--accent-bg:rgba(148,50,55,.2);--edge:#e56c70}.progress{height:14px;border-radius:15px;background:color-mix(in srgb,var(--accent) 28%,#1c2d36);overflow:hidden}.fill{height:100%;border-radius:15px;background:var(--accent);width:0}.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal-back.open{display:flex}.modal{width:min(520px,96vw);max-height:94vh;overflow:auto;background:#142432;border:1.5px solid #657785;border-radius:18px;padding:23px}.modal h2{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:#d7e2eb;font-size:14px}.wide{grid-column:1/-1}.field input,.field textarea{width:100%;background:#091722;border:1px solid #526675;border-radius:9px;color:#fff;padding:11px}.field textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}.btn{background:#263846;color:white;border:1px solid #697986;border-radius:11px;padding:11px 20px}.btn.primary{background:#1267f7;border-color:#1267f7;font-weight:700}.btn.danger{margin-right:auto;color:#ffb4b4}.empty{color:#bfcbd7;padding:25px;text-align:center}.hidden{display:none!important}@media(max-width:760px){.app{height:auto;min-height:100dvh;overflow:visible;padding:14px}.brand{font-size:26px}.nav{min-width:0;font-size:15px;min-height:42px}.intro h1{font-size:31px}}
</style><style>.dependency-field{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:#d7e2eb;font-size:15px}.dependency-field input{width:20px;height:20px;accent-color:#347aff}.dependency-hint{font-size:12px;color:#b8cadb;grid-column:1/-1}.task-dependency{color:#8dbbff;font-size:12px;margin-top:4px}.field select{width:100%;background:#091722;border:1px solid #526675;border-radius:9px;color:white;padding:11px}</style><style>.detail{flex:1;min-height:0;display:grid;grid-template-columns:32% minmax(0,1fr);gap:23px;margin-top:15px}.summary{padding:29px;display:flex;flex-direction:column;justify-content:space-between;background:var(--accent-bg);border-color:var(--edge);min-height:0}.summary .eyebrow{font-weight:800;color:var(--accent);font-size:18px}.summary h2{font-size:clamp(28px,3.2vw,52px);line-height:1.13;margin:15px 0;overflow-wrap:anywhere}.summary .pct{font-size:clamp(55px,7vw,100px);font-weight:800;color:var(--accent);line-height:1}.summary .progress{margin-top:16px}.summary .count,.summary .due{font-size:22px;margin-top:18px}.tasks{padding:26px;display:flex;flex-direction:column;min-height:0}.tasks h1{font-size:35px;margin:0 0 12px}.tasks p{font-size:21px;margin:0 0 22px}.task-scroll{flex:1}.task-row{display:flex;align-items:center;gap:20px;min-height:59px;border-bottom:1px solid #485a67;padding:8px 5px}.task-check{width:35px;height:35px;border:2px solid #a7b8c6;border-radius:9px;flex:none;background:transparent;color:white;font-size:24px}.task-check.done{background:#13794e;border-color:#13794e}.task-name{font-size:22px;flex:1;min-width:0;overflow-wrap:anywhere}.task-name.done{text-decoration:line-through;color:#c4cbd3}.task-dates{font-size:13px;color:#aebfcd;margin-top:5px}.task-content{flex:1;min-width:0}.task-edit{border:0;background:transparent;color:#c5d4df;font-size:20px;padding:9px}.footer{flex:none;display:flex;justify-content:center;align-items:center;gap:15px;padding:5px 0 0}.edit-stack{display:flex;flex-direction:column;gap:8px}.delete-project{height:39px;min-width:255px;border:1px solid #b95b66;border-radius:10px;background:#5a202b;color:#ffe2e4;font-size:17px;font-weight:700}.big{height:65px;min-width:255px;border:1.5px solid #687a88;border-radius:14px;background:transparent;color:#fff;font-size:22px;font-weight:700}.big.primary{background:#0861f5;border-color:#0861f5}@media(max-width:760px){.detail{display:block}.summary{min-height:350px;margin-bottom:16px}.tasks{min-height:350px}.footer{flex-wrap:wrap}.big{min-width:180px}}</style></head><body><div class="app"><header class="top"><div class="brand">PORD-01</div><a class="nav" href="projects.html">◇ &nbsp; Projects</a></header><main class="detail"><section class="summary panel green" id="summary"><div class="empty">Loading project…</div></section><section class="tasks panel"><h1>One step at a time.</h1><p class="muted" id="subtitle">Your next project tasks</p><div class="task-scroll scroll" id="task-list"></div></section></main><footer class="footer"><button class="big primary" id="add">＋ &nbsp; Add task</button><div class="edit-stack"><button class="big" id="edit">✎ &nbsp; Edit project</button><button class="delete-project" id="deleteProject">Delete project</button></div></footer><div class="status" id="status"></div></div><div class="modal-back" id="modal"><div class="modal"><h2 id="modal-title">Add task</h2><form id="form"><div class="fields"><label class="field wide">Name<input id="name" required maxlength="180"></label><label class="field wide" id="description-wrap">Description<textarea id="description"></textarea></label><label class="field" id="start-wrap">Start date<input id="start" type="date"></label><label class="field" id="due-wrap">End date<input id="due" type="date"></label><label class="dependency-field hidden" id="dependency-wrap"><input type="checkbox" id="depends">Must wait for another task to be completed</label><label class="field wide hidden" id="predecessor-wrap">Wait for task<select id="predecessor"><option value="">Select a task</option></select></label><div class="dependency-hint hidden" id="dependency-hint">Start date follows the prerequisite task’s scheduled end date; once completed, it follows the actual completion date. End date moves by the same number of days.</div></div><div class="actions"><button type="button" class="btn danger hidden" id="delete">Delete</button><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" id="save" type="submit">Save</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
'use strict';
const db=window.supabase?window.supabase.createClient('https://xxsxhxuaxhvfhpgodhnk.supabase.co','sb_publishable_zdPwmxzkFiMTyGqaW0w15Q_iT4RAILn'):null;
const $=id=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,projects=[],tasks=[];
const prop=(o,keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null};
const projTitle=p=>prop(p,['name','title','project_name'])||'Untitled project';
const taskTitle=t=>prop(t,['title','name','task_name'])||'Untitled task';
const projectStart=p=>prop(p,['start_date','start_at','started_at','created_at']);
const projectDue=p=>{const ends=projectTasks(p).map(t=>asDate(prop(t,['end_date','due_date','due_at']))).filter(Boolean);return ends.length?new Date(Math.max(...ends.map(d=>d.getTime()))):null};
const taskDone=t=>t.completed===true||t.is_complete===true||t.is_completed===true||t.done===true||t.status==='completed'||t.status==='done';
const projectTasks=p=>tasks.filter(t=>String(prop(t,['project_id','project_uuid']))===String(p.id));
const asDate=x=>{if(!x)return null;const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(String(x))?String(x)+'T12:00:00':x);return isNaN(d)?null:d};
const fmtDate=x=>{const d=asDate(x);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'No due date'};
function metrics(p){const list=projectTasks(p),done=list.filter(taskDone).length,total=list.length,actual=total?done/total:0,start=asDate(projectStart(p)),end=asDate(projectDue(p));let expected=0;if(start&&end&&end>start){expected=Math.max(0,Math.min(1,(Date.now()-start.getTime())/(end-start)));}else if(end&&Date.now()>end.getTime())expected=1;const gap=expected-actual;const color=gap>.35?'red':gap>.12?'yellow':'green';return {done,total,actual,expected,color,pct:Math.round(actual*100),label:color==='red'?'WAY BEHIND':color==='yellow'?'BEHIND SCHEDULE':'IN PROGRESS'};}
async function initData(){if(!db)throw Error('Supabase library did not load. Check your internet connection.');const {data:{session},error:se}=await db.auth.getSession();if(se)throw se;if(!session){location.href='index.html';return false;}user=session.user;const [pr,tr]=await Promise.all([db.from('projects').select('*').eq('user_id',user.id),db.from('tasks').select('*').eq('user_id',user.id)]);if(pr.error)throw pr.error;if(tr.error)throw tr.error;projects=pr.data||[];tasks=tr.data||[];return true;}
function showError(e){$('status').textContent='Error: '+(e.message||String(e));}
</script><script>
let current=null,editingTask=null,editingProject=false;
const params=new URLSearchParams(location.search);const projectId=params.get('id')||params.get('project_id');
function render(){if(!current)return;const m=metrics(current);$('summary').className='summary panel '+m.color;$('summary').innerHTML=`<div class="eyebrow">${m.label}</div><h2>${safe(projTitle(current))}</h2><div><div class="pct">${m.pct}%</div><div class="progress"><div class="fill" style="width:${m.pct}%"></div></div><div class="count">${m.done} of ${m.total} tasks complete</div><div class="due">${projectDue(current)?'Due '+safe(fmtDate(projectDue(current))):'No task end date yet'}</div></div>`;$('subtitle').textContent='Next tasks for '+projTitle(current);const list=projectTasks(current);$('task-list').innerHTML=list.length?list.map(t=>`<div class="task-row"><button class="task-check ${taskDone(t)?'done':''}" data-check="${safe(t.id)}" aria-label="Toggle task">${taskDone(t)?'✓':''}</button><div class="task-content"><div class="task-name ${taskDone(t)?'done':''}">${safe(taskTitle(t))}</div><div class="task-dates">${safe(taskDateLabel(t))}</div>${t.depends_on_task_id?`<div class="task-dependency">↳ Waits for ${safe(taskTitle(tasks.find(x=>String(x.id)===String(t.depends_on_task_id))||{}))}</div>`:""}</div><button class="task-edit" data-edit="${safe(t.id)}" aria-label="Edit task">✎</button></div>`).join(''):'<div class="empty">No tasks yet. Select Add task to get started.</div>';$('task-list').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.check));$('task-list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTask(b.dataset.edit));}
function taskDateLabel(t){const a=prop(t,['start_date','start_at']),b=prop(t,['end_date','due_date','due_at']);if(!a&&!b)return 'No task dates';return (a?'Start '+fmtDate(a):'No start date')+'  ·  '+(b?'End '+fmtDate(b):'No end date');}
function taskDoneField(t){return ['completed','is_complete','is_completed','done'].find(k=>Object.prototype.hasOwnProperty.call(t,k))||'status'}
const todayKey=()=>dateOnly(new Date());
const dayIndex=x=>Math.floor(Date.parse(x+'T12:00:00Z')/86400000);
const dayShift=(x,n)=>{const d=new Date(x+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const taskDuration=t=>Number.isInteger(t.duration_days)&&t.duration_days>=0?t.duration_days:(t.start_date&&t.end_date?Math.max(0,dayIndex(t.end_date)-dayIndex(t.start_date)):0);
function dependencyDate(t){const p=tasks.find(x=>String(x.id)===String(t.depends_on_task_id));return p?(taskDone(p)?p.completed_at?.slice(0,10)||todayKey():dateOnly(prop(p,['end_date','due_date','due_at']))):null;}
async function synchronizeDependencies(){
 // Reconcile chains in topological order; stop on cycles (the form prevents new ones).
 const visiting=new Set(),visited=new Set();
 async function visit(t){
  if(visited.has(String(t.id)))return;
  if(visiting.has(String(t.id)))throw Error('A circular task dependency was found.');
  visiting.add(String(t.id));
  const p=tasks.find(x=>String(x.id)===String(t.depends_on_task_id));
  if(p){await visit(p);const date=dependencyDate(t);if(date){const duration=taskDuration(t),end=dayShift(date,duration);
   if(t.start_date!==date||t.end_date!==end){const payload={start_date:date,end_date:end};const {error}=await db.from('tasks').update(payload).eq('id',t.id).eq('user_id',user.id);if(error)throw error;Object.assign(t,payload)}
  }}
  visiting.delete(String(t.id));visited.add(String(t.id));
 }
 for(const t of projectTasks(current))await visit(t);
}
async function toggleTask(id){
 const t=tasks.find(t=>String(t.id)===id);if(!t)return;
 const field=taskDoneField(t),next=!taskDone(t);
 const payload=field==='status'?{status:next?'completed':'pending'}:{[field]:next};
 payload.completed_at=next?new Date().toISOString():null;
 try{const {error}=await db.from('tasks').update(payload).eq('id',id).eq('user_id',user.id);if(error)throw error;
 Object.assign(t,payload);await synchronizeDependencies();render();}catch(e){showError(e)}
}
function dateOnly(x){const d=asDate(x);return d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):''}
function openModal(){ $('modal').classList.add('open');$('status').textContent='';}
function closeModal(){$('modal').classList.remove('open');editingTask=null;editingProject=false;}
function updateDependencyUI(){
 const on=$('depends').checked;
 $('predecessor-wrap').classList.toggle('hidden',!on);
 $('dependency-hint').classList.toggle('hidden',!on);
 $('start').readOnly=on;
 if(on){const id=$('predecessor').value,p=tasks.find(t=>String(t.id)===id);
  if(p){const date=taskDone(p)?p.completed_at?.slice(0,10)||todayKey():dateOnly(prop(p,['end_date','due_date','due_at']));
   if(date){const oldStart=$('start').value,oldEnd=$('due').value;
    const duration=oldStart&&oldEnd?Math.max(0,dayIndex(oldEnd)-dayIndex(oldStart)):(editingTask?taskDuration(editingTask):0);
    $('start').value=date;
    if(oldEnd||editingTask?.end_date)$('due').value=dayShift(date,duration);
   }else $('start').value='';
  }else $('start').value='';
 }
}
$('depends').onchange=updateDependencyUI;
$('predecessor').onchange=updateDependencyUI;
function openTask(id){
 editingProject=false;editingTask=id?tasks.find(t=>String(t.id)===id):null;
 $('modal-title').textContent=editingTask?'Edit task':'Add task';$('name').value=editingTask?taskTitle(editingTask):'';
 $('description-wrap').classList.add('hidden');$('start-wrap').classList.remove('hidden');$('due-wrap').classList.remove('hidden');
 $('dependency-wrap').classList.remove('hidden');
 $('start').value=editingTask?dateOnly(prop(editingTask,['start_date','start_at'])):'';
 $('due').value=editingTask?dateOnly(prop(editingTask,['end_date','due_date','due_at'])):'';
 const eligible=projectTasks(current).filter(t=>!editingTask||String(t.id)!==String(editingTask.id));
 $('predecessor').innerHTML='<option value="">Select a task</option>'+eligible.map(t=>`<option value="${safe(t.id)}">${safe(taskTitle(t))}</option>`).join('');
 $('depends').checked=!!editingTask?.depends_on_task_id;
 $('predecessor').value=editingTask?.depends_on_task_id||'';
 $('delete').classList.toggle('hidden',!editingTask);updateDependencyUI();openModal();
}
function openProject(){editingProject=true;editingTask=null;$('modal-title').textContent='Edit project';$('name').value=projTitle(current);$('description').value=prop(current,['description','notes'])||'';$('start').value=dateOnly(projectStart(current));$('due').value='';$('description-wrap').classList.remove('hidden');$('start-wrap').classList.remove('hidden');$('due-wrap').classList.add('hidden');$('delete').classList.add('hidden');$('dependency-wrap').classList.add('hidden');$('predecessor-wrap').classList.add('hidden');$('dependency-hint').classList.add('hidden');$('start').readOnly=false;openModal();}
$('deleteProject').onclick=async()=>{
 if(!current||!user)return;
 if(!confirm('Delete '+projTitle(current)+' and all of its tasks? This cannot be undone.'))return;
 if(!confirm('Confirm permanent deletion of this project.'))return;
 $('deleteProject').disabled=true;
 try{
  const related=projectTasks(current);
  const ids=related.map(t=>t.id);
  if(ids.length){const delTasks=await db.from('tasks').delete().eq('user_id',user.id).in('id',ids);if(delTasks.error)throw delTasks.error;}
  const result=await db.from('projects').delete().eq('id',current.id).eq('user_id',user.id);
  if(result.error)throw result.error;
  location.href='projects.html';
 }catch(e){showError(e);$('deleteProject').disabled=false;}
};
$('add').onclick=()=>openTask();$('edit').onclick=openProject;$('cancel').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
$('form').onsubmit=async e=>{
 e.preventDefault();$('save').disabled=true;
 try{
  let res;
  if(editingProject){
   const payload={};const nameField=['name','title','project_name'].find(k=>Object.prototype.hasOwnProperty.call(current,k))||'name';
   payload[nameField]=$('name').value.trim();
   const descField=['description','notes'].find(k=>Object.prototype.hasOwnProperty.call(current,k));if(descField)payload[descField]=$('description').value;
   const startField=['start_date','start_at','started_at'].find(k=>Object.prototype.hasOwnProperty.call(current,k));if(startField)payload[startField]=$('start').value||null;
   res=await db.from('projects').update(payload).eq('id',current.id).eq('user_id',user.id);
   if(!res.error)Object.assign(current,payload);
  }else{
   const dependency=$('depends').checked?$('predecessor').value:null;
   if($('depends').checked&&!dependency)throw Error('Select the task this one must wait for.');
   if(dependency){
    let ancestor=tasks.find(t=>String(t.id)===dependency),visited=new Set();
    while(ancestor){if(editingTask&&String(ancestor.id)===String(editingTask.id))throw Error('Tasks cannot depend on themselves or form a circular dependency.');
     if(visited.has(String(ancestor.id)))throw Error('A circular dependency already exists.');visited.add(String(ancestor.id));
     ancestor=tasks.find(t=>String(t.id)===String(ancestor.depends_on_task_id));
    }
    const p=tasks.find(t=>String(t.id)===dependency);
    if(!taskDone(p)&&!dateOnly(prop(p,['end_date','due_date','due_at'])))throw Error('The prerequisite task needs an end date before you can depend on it.');
   }
   let start=$('start').value||null,end=$('due').value||null;
   if(start&&end&&end<start)throw Error('End date cannot be before start date.');
   let duration=start&&end?dayIndex(end)-dayIndex(start):editingTask?taskDuration(editingTask):0;
   if(dependency){const p=tasks.find(t=>String(t.id)===dependency);start=taskDone(p)?p.completed_at?.slice(0,10)||todayKey():dateOnly(prop(p,['end_date','due_date','due_at']));
    if(!start)throw Error('Prerequisite task has no completion date or scheduled end date.');
    end=end?dayShift(start,duration):null;
   }
   const sample=editingTask||tasks[0]||{};
   const field=['title','name','task_name'].find(k=>Object.prototype.hasOwnProperty.call(sample,k))||'title';
   const payload={[field]:$('name').value.trim(),start_date:start,end_date:end,depends_on_task_id:dependency,duration_days:duration};
   if(editingTask){res=await db.from('tasks').update(payload).eq('id',editingTask.id).eq('user_id',user.id);if(!res.error)Object.assign(editingTask,payload)}
   else{const fk=['project_id','project_uuid'].find(k=>Object.prototype.hasOwnProperty.call(sample,k))||'project_id';
    res=await db.from('tasks').insert({user_id:user.id,[fk]:current.id,...payload}).select().single();if(!res.error)tasks.push(res.data)}
  }
  if(res.error)throw res.error;
  if(!editingProject)await synchronizeDependencies();
  closeModal();render();
 }catch(err){showError(err)}finally{$('save').disabled=false}
};
$('delete').onclick=async()=>{if(!editingTask||!confirm('Delete this task?'))return;const {error}=await db.from('tasks').delete().eq('id',editingTask.id).eq('user_id',user.id);if(error){showError(error);return;}tasks=tasks.filter(t=>t.id!==editingTask.id);for(const t of tasks.filter(t=>String(t.depends_on_task_id)===String(editingTask.id))){const payload={depends_on_task_id:null};const r=await db.from('tasks').update(payload).eq('id',t.id).eq('user_id',user.id);if(r.error){showError(r.error);return;}Object.assign(t,payload)}closeModal();render();};
(async()=>{try{if(!projectId){$('status').textContent='No project selected. Return to Projects and choose one.';return;}if(await initData()){current=projects.find(p=>String(p.id)===projectId);if(!current){$('status').textContent='Project not found.';return;}await synchronizeDependencies();render();}}catch(e){showError(e);}})();
</script><script src="pord-timer-alert.js"></script>
