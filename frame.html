const cfg=settings[0]||{};slideMs=Math.max(5000,Number(cfg.slideshow_seconds||15)*1000);refreshMs=Math.max(30000,Number(cfg.refresh_minutes||5)*60000);const now=new Date(),next=[];
if(cfg.show_projects!==false)for(const p of projects){if(String(p.status||'active').toLowerCase()==='completed'||String(p.status||'').toLowerCase()==='archived')continue;next.push({type:'project',key:'project-'+p.id,project:p,metric:schedule(p,tasks)});}
if(cfg.show_birthdays!==false){for(const b of birthdays){const birth=pick(b,['birth_date','date_of_birth','birthday']);const x=yearly(birth,now);if(x&&inside(x.date,now,true))next.push({type:'birthday',key:'birthday-'+b.id,name:pick(b,['name','person_name','title'])||'Someone',age:x.age,when:x.date});}for(const b of special.filter(x=>x.kind==='birthday')){const x=yearly(b.date_of_birth,now);if(x&&inside(x.date,now,true))next.push({type:'birthday',key:'special-birthday-'+b.id,name:b.person_name,age:x.age,when:x.date});}}
if(cfg.show_events!==false){for(const g of special.filter(x=>x.kind==='sports')){const d=date(g.starts_at);if(inside(d,now))next.push({type:'sports',key:'sports-'+g.id,home:g.home_team,away:g.away_team,when:d});}for(const e of events){const cat=String(pick(e,['category','type','calendar'])||'Family').toLowerCase();if(cat.includes('project')||cat.includes('reminder')||cat.includes('birthday'))continue;const originalStart=date(pick(e,['start_time','start_date','event_date','date','starts_at']));const d=nextRepeat(pick(e,['start_time','start_date','event_date','date','starts_at']),e.recurrence,now);const allDay=e.all_day===true||(/^\d{4}-\d{2}-\d{2}$/.test(String(pick(e,['start_date','start_time','date'])||'')));const end=date(pick(e,['end_time','ends_at','end_date']));const ongoing=!!(originalStart&&end&&originalStart<=now&&end>=now);if(!inside(d,now,allDay)&&!ongoing)continue;const displayDate=ongoing?now:d;if(cat.includes('sport')){next.push({type:'family',key:'event-'+e.id,title:pick(e,['title','name'])||'Sports event',notes:pick(e,['description','notes'])||'',when:displayDate,allDay});}else next.push({type:'family',key:'event-'+e.id,title:pick(e,['title','name'])||'Family event',notes:pick(e,['description','notes'])||'',when:displayDate,allDay});}}
reminderRecords=reminders.filter(r=>r.enabled!==false);checkReminders();
stage('Building '+next.length+' slides…');const old=slides[index]&&slides[index].key;slides=next;const match=slides.findIndex(s=>s.key===old);index=match>=0?match:0;render();$('error').textContent='';}catch(e){$('error').textContent=e.message;console.error(e);if(!slides.length){$('slides').innerHTML='<div class="slide active"><div class="empty"><h1>Unable to load slideshow</h1><p>'+esc(e.message)+'</p></div></div>';}}finally{loading=false;}}
// Optional logo metadata. If table is not created, slides still work using team initials and colors.
async function loadTeams(){if(!db)return;try{const r=await withTimeout(db.from('sports_teams').select('name,abbreviation,primary_color,logo_url'),6000,'Sports logos');if(!r.error)teams=r.data||[];}catch(e){console.warn('Team logos unavailable',e);}}
// Reminders are interrupting alerts, not slideshow slides. The dismissal is per occurrence.
function reminderOccurrence(r,now){const original=date(r.due_at);if(!original||original>now)return null;const rec=String(r.recurrence||'none').toLowerCase();if(rec==='none')return original;let occurrence=new Date(original);let count=0;while(count++<3000){let next=new Date(occurrence);if(rec==='daily')next.setDate(next.getDate()+1);else if(rec==='weekly')next.setDate(next.getDate()+7);else if(rec==='monthly'){const day=original.getDate();next.setDate(1);next.setMonth(next.getMonth()+1);next.setDate(Math.min(day,new Date(next.getFullYear(),next.getMonth()+1,0).getDate()));}else if(rec==='yearly'){const m=original.getMonth(),day=original.getDate();next.setFullYear(next.getFullYear()+1,m,1);next.setDate(Math.min(day,new Date(next.getFullYear(),m+1,0).getDate()));}else return null;if(next>now)return occurrence;occurrence=next;}return null;}
function dismissed(key){try{return localStorage.getItem('pord-dismiss-'+key)==='1'}catch(e){return false}}
function markDismissed(key){try{localStorage.setItem('pord-dismiss-'+key,'1')}catch(e){}}
function checkReminders(){if(activeAlert)return;const now=new Date();const grace=10*60*1000;for(const r of reminderRecords){const d=reminderOccurrence(r,now);if(!d)continue;const elapsed=now.getTime()-d.getTime();if(elapsed<0||elapsed>grace)continue;const key=String(r.id)+'-'+d.getTime();if(dismissed(key))continue;activeAlert={key};$('alertMessage').textContent=r.title||'Reminder';$('alertSub').textContent=r.notes||'';$('reminderOverlay').style.display='flex';return;}}
$('reminderOverlay').addEventListener('click',function(e){e.stopPropagation();if(!activeAlert)return;markDismissed(activeAlert.key);activeAlert=null;this.style.display='none';slideSince=Date.now();checkReminders();});
// Any tap opens dashboard; the rightmost quarter is reserved for calendar on non-sports slides.
$('screen').addEventListener('click',e=>{if(activeAlert)return;const s=slides[index];if(s&&s.type!=='sports'&&e.clientX/window.innerWidth>.75){location.href='calendar.html';return;}location.href='dashboard.html';});
(async()=>{await load();loadTeams().then(()=>{if(slides.length)render();});})();setInterval(tick,500);let last=Date.now();setInterval(async()=>{if(Date.now()-last>=refreshMs){last=Date.now();await load();loadTeams().then(()=>{if(slides.length)render();});}},10000);
window.addEventListener('error',function(e){const el=document.getElementById('error');if(el)el.textContent='Page error: '+(e.message||'Unknown error');});
</script></body></html>
